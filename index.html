<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>비움 — 간헐적 단식</title>
<meta name="description" content="비워낸 시간만큼 가벼워지는, 감성 간헐적 단식 기록">
<meta name="theme-color" content="#1d1940" id="metaTheme">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@property --s1 { syntax:'<color>'; inherits:true; initial-value:#1d1940; }
@property --s2 { syntax:'<color>'; inherits:true; initial-value:#3e3470; }
@property --s3 { syntax:'<color>'; inherits:true; initial-value:#7d6aa8; }
@property --acc { syntax:'<color>'; inherits:true; initial-value:#cbbcff; }
@property --acc2 { syntax:'<color>'; inherits:true; initial-value:#ffc2dc; }

:root{
  /* 밤·저녁·새벽 (어두운 하늘, 밝은 글씨) */
  --ink:#f8f4ff; --ink2:rgba(248,244,255,.78); --ink3:rgba(248,244,255,.55); --ink4:rgba(248,244,255,.25);
  --glass:rgba(20,16,48,.34); --glass2:rgba(255,255,255,.09); --line:rgba(255,255,255,.14);
  --soft:rgba(255,255,255,.08); --soft2:rgba(255,255,255,.13); --track:rgba(255,255,255,.12);
  --navbg:rgba(26,21,60,.86); --sheetbg:#1a1540; --nodebg:#2a2350; --dim:rgba(20,16,48,.2);
  --hill1:rgba(10,7,30,.28); --hill2:rgba(8,6,26,.5); --danger:#ffb3b3; --btnink:#2a2050;
  --serif:'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --num:'Pretendard Variable', Pretendard, -apple-system, sans-serif;
  --sans:'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --navh:64px;
  --sat:env(safe-area-inset-top, 0px); --sab:env(safe-area-inset-bottom, 0px); /* 안드로이드 앱에서는 앱이 직접 채워 줘요 */
  color-scheme:dark;
}
/* 아침·낮 (밝은 하늘, 진한 글씨) */
:root[data-tone="light"]{
  --ink:#3d3366; --ink2:rgba(61,51,102,.8); --ink3:rgba(61,51,102,.58); --ink4:rgba(61,51,102,.25);
  --glass:rgba(255,255,255,.52); --glass2:rgba(255,255,255,.55); --line:rgba(255,255,255,.8);
  --soft:rgba(255,255,255,.55); --soft2:rgba(255,255,255,.75); --track:rgba(255,255,255,.7);
  --navbg:rgba(255,255,255,.9); --sheetbg:#fbf8ff; --nodebg:#ffffff; --dim:rgba(255,255,255,.35);
  --hill1:rgba(255,255,255,.35); --hill2:rgba(255,255,255,.6); --danger:#d9536a;
  color-scheme:light;
}
html{ transition:--s1 3s ease, --s2 3s ease, --s3 3s ease, --acc 2s ease, --acc2 2s ease; background:#140f30; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{ margin:0; min-height:100vh; font-family:var(--sans); font-variant-numeric:tabular-nums; color:var(--ink); background:transparent;-webkit-font-smoothing:antialiased; overflow-x:hidden; }
button{ font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0; }
input,textarea{ font:inherit; color:var(--ink); }
[hidden]{ display:none !important; }

/* ── 하늘 ───────────────────────── */
.sky{ position:fixed; inset:0; z-index:-4; background:linear-gradient(180deg, var(--s1) 0%, var(--s2) 55%, var(--s3) 100%); }
.glow{ position:fixed; z-index:-3; width:120vw; height:120vw; max-width:760px; max-height:760px; left:50%; top:-22vw; transform:translateX(-50%);
  background:radial-gradient(closest-side, color-mix(in srgb, var(--acc) 26%, transparent), transparent 70%); filter:blur(10px); pointer-events:none; }
.stars{ position:fixed; inset:0 0 30% 0; z-index:-2; pointer-events:none; transition:opacity 2.4s ease; }
.stars i{ position:absolute; border-radius:50%; background:#fff; animation:tw var(--d,4s) ease-in-out infinite; animation-delay:var(--dl,0s); }
@keyframes tw{ 0%,100%{opacity:.15} 50%{opacity:.95} }
.hills{ position:fixed; left:0; right:0; bottom:0; width:100%; height:26vh; z-index:-1; pointer-events:none; }
.hills .h1{ fill:var(--hill1); transition:fill 3s; } .hills .h2{ fill:var(--hill2); transition:fill 3s; }
/* 낮 구름 */
.clouds{ position:fixed; inset:0 0 40% 0; z-index:-2; pointer-events:none; transition:opacity 3s ease; overflow:hidden; }
.cloud{ position:absolute; width:var(--w,90px); height:calc(var(--w,90px) * .34); border-radius:999px; background:rgba(255,255,255,.85);
  animation:drift var(--t,70s) linear infinite; animation-delay:var(--dl,0s); filter:drop-shadow(0 6px 10px rgba(120,140,200,.12)); }
.cloud::before, .cloud::after{ content:''; position:absolute; background:inherit; border-radius:50%; }
.cloud::before{ width:48%; height:140%; left:16%; bottom:20%; }
.cloud::after{ width:36%; height:110%; right:14%; bottom:28%; }
@keyframes drift{ from{ transform:translateX(-30vw); } to{ transform:translateX(130vw); } }

/* ── 뼈대 ───────────────────────── */
.app{ max-width:460px; margin:0 auto; padding:calc(var(--sat) + 14px) 16px calc(var(--navh) + var(--sab) + 28px); }
.top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; }
.brand{ font-family:var(--serif); font-weight:700; font-size:24px; }
.brand small{ font-family:var(--sans); font-weight:400; font-size:11px; letter-spacing:.02em; color:var(--ink3); margin-left:6px; }
.date{ font-size:12.5px; color:var(--ink2); margin-top:2px; }
.icon-btn{ width:42px; height:42px; flex:0 0 42px; border-radius:50%; display:grid; place-items:center; background:var(--glass2); border:1px solid var(--line); }
.icon-btn svg{ width:20px; height:20px; }

.card{ background:var(--glass); border:1px solid var(--line); border-radius:24px; padding:18px; -webkit-backdrop-filter:blur(18px) saturate(1.15); backdrop-filter:blur(18px) saturate(1.15); }
.card + .card{ margin-top:14px; }
.eyebrow{ font-size:11.5px; letter-spacing:.14em; color:var(--ink3); text-transform:uppercase; }
.h-serif{ font-family:var(--serif); font-weight:700; }
.muted{ color:var(--ink3); }
.view{ animation:fadeUp .5s ease both; }
@keyframes fadeUp{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

/* ── 오늘 ───────────────────────── */
.streak{ display:flex; justify-content:center; margin-top:12px; }
.streak-pill{ padding:7px 16px; border-radius:999px; font-family:var(--serif); font-weight:700; font-size:14.5px; color:#fff;
  background:linear-gradient(135deg,#ffb36b,#ff7d95); box-shadow:0 8px 18px -10px #ff7d95, inset 0 1px 0 rgba(255,255,255,.4); animation:pop .5s cubic-bezier(.3,1.6,.5,1) both; }
.streak-pill.mile{ background:linear-gradient(135deg,#ffd36b,#ff8fb1,#b892ff); box-shadow:0 0 0 3px rgba(255,255,255,.35), 0 10px 22px -10px #ff8fb1; }
.streak-pill.soft{ background:var(--glass2); color:var(--ink2); border:1px solid var(--line); box-shadow:none; font-size:13.5px; }
.bubble{ position:relative; margin:12px auto 0; width:fit-content; max-width:86%; padding:9px 16px; border-radius:18px; background:#fff; color:#4a3f78;
  font-size:13.5px; line-height:1.5; text-align:center; word-break:keep-all; box-shadow:0 8px 20px -12px rgba(30,20,70,.45); animation:pop .5s cubic-bezier(.3,1.6,.5,1) both; }
.bubble::after{ content:''; position:absolute; left:50%; bottom:-6px; width:13px; height:13px; background:#fff; transform:translateX(-50%) rotate(45deg); border-radius:0 0 3px 0; }
@keyframes pop{ from{ transform:scale(.85); opacity:0; } to{ transform:none; opacity:1; } }

.ring-box{ position:relative; width:min(100%, 300px); aspect-ratio:1; margin:20px auto 0; }
.ring{ width:100%; height:100%; display:block; overflow:visible; }
.ring .track{ fill:none; stroke:var(--track); stroke-width:16; }
.ring .inner{ fill:none; stroke:var(--ink4); stroke-width:2.2; stroke-linecap:round; stroke-dasharray:0.1 9; }
.ring .prog{ fill:none; stroke:url(#rg); stroke-width:16; stroke-linecap:round; transform:rotate(-90deg); transform-origin:150px 150px; transition:stroke-dashoffset 1s linear; }
.ring .mk{ fill:var(--track); stroke:none; }
.ring .mk.on{ fill:#fff; stroke:var(--acc); stroke-width:2.5; }
.ring .mkl{ font-family:var(--num); font-weight:500; font-size:11px; fill:var(--ink3); text-anchor:middle; dominant-baseline:middle; }
.ring .mkl.on{ fill:var(--ink); }
.ring .orb{ fill:#fff; stroke:var(--acc); stroke-width:3.5; filter:drop-shadow(0 2px 4px rgba(30,20,70,.25)); }
.ring-box.ach .prog{ animation:breathe 2.6s ease-in-out infinite; }
@keyframes breathe{ 0%,100%{ opacity:1; } 50%{ opacity:.7; } }
.ring-center{ position:absolute; inset:15%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:2px; }
.mascot{ width:46%; height:auto; overflow:visible; animation:bob 3.4s ease-in-out infinite; }
@keyframes bob{ 50%{ transform:translateY(-5px); } }
.mascot .blink{ transform-box:fill-box; transform-origin:center; animation:blink 5s infinite; }
@keyframes blink{ 0%,93%,100%{ transform:scaleY(1); } 96%{ transform:scaleY(.12); } }
.mascot .rays{ transform-origin:50px 52px; animation:spin 26s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.mascot .spark{ transform-box:fill-box; transform-origin:center; animation:twinkle 1.8s ease-in-out infinite; }
.mascot .spark:nth-of-type(2n){ animation-delay:-.9s; }
@keyframes twinkle{ 50%{ transform:scale(.55); opacity:.5; } }
.mascot .zz{ animation:zz 3s ease-in-out infinite; }
@keyframes zz{ 0%{ opacity:0; transform:translate(0,4px); } 40%{ opacity:1; } 100%{ opacity:0; transform:translate(6px,-8px); } }
.rc-time{ display:inline-block; font-family:var(--num); font-weight:700; font-size:clamp(24px, 8.6vw, 32px); line-height:1.15; margin-top:4px; white-space:nowrap; letter-spacing:.02em; font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; transform-origin:center; }
.rc-sub{ font-size:12.5px; color:var(--ink2); line-height:1.4; }
.rc-sub b{ color:var(--ink); }

#mainBtn{ margin-top:14px; }
.stage-pill{ display:flex; align-items:center; gap:8px; margin:calc(var(--navh) + var(--sab) + 40px) auto 0; max-width:100%; padding:10px 14px 10px 12px; border-radius:999px; background:var(--glass2);
  border:1px solid var(--line); font-size:14px; color:var(--ink); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
.stage-pill .sp-dot{ width:22px; height:22px; flex:0 0 22px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; font-size:12px; }
.stage-pill b{ font-family:var(--serif); font-weight:700; font-size:15px; }
.stage-pill small{ color:var(--ink3); font-size:12px; white-space:nowrap; }
.stage-pill svg{ width:14px; height:14px; flex:0 0 14px; opacity:.55; }

.times{ display:flex; gap:8px; margin:10px 0 0; }
.times > *{ flex:1 1 0; min-width:0; padding:7px 12px; border-radius:16px; background:var(--glass2); border:1px solid var(--line); text-align:left; }
.times .t-k{ font-size:11px; color:var(--ink3); line-height:1.3; }
.times .t-v{ font-size:13.5px; margin-top:1px; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; justify-content:space-between; align-items:center; gap:4px; }
.times .t-v span{ overflow:hidden; text-overflow:ellipsis; }
.times svg{ width:13px; height:13px; opacity:.55; flex:0 0 auto; }

.primary{ display:block; width:100%; height:56px; margin-top:16px; border-radius:999px; font-family:var(--serif); font-weight:700; font-size:19px; color:var(--btnink);
  background:linear-gradient(135deg, var(--acc), var(--acc2)); box-shadow:0 12px 26px -14px var(--acc), inset 0 -3px 0 rgba(0,0,0,.08), inset 0 2px 0 rgba(255,255,255,.45); transition:transform .15s ease; }
.primary:active{ transform:scale(.97); }
.primary.soft{ background:var(--soft2); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
.alarm-btn{ display:flex; align-items:center; justify-content:center; gap:8px; margin:12px auto 0; padding:10px 16px; border-radius:999px; font-size:13.5px; color:var(--ink); background:var(--glass2); border:1px solid var(--line); max-width:100%; }
.alarm-btn svg{ width:16px; height:16px; flex:0 0 16px; color:var(--acc); }
.alarm-btn.todo{ border-color:color-mix(in srgb, var(--acc) 55%, transparent); box-shadow:0 0 18px -6px var(--acc); }
.alarm-btn.done{ color:var(--ink2); }
.link{ display:block; margin:12px auto 0; font-size:13px; color:var(--ink3); text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--ink4); padding:6px 10px; }

.stage-card{ margin-top:22px; position:relative; overflow:hidden; }
.stage-card::before{ content:''; position:absolute; right:-60px; top:-60px; width:180px; height:180px; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--acc) 35%, transparent), transparent); pointer-events:none; }
.sc-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.sc-title{ font-family:var(--serif); font-weight:700; font-size:22px; margin:8px 0 2px; }
.sc-range{ font-size:12px; color:var(--ink3); white-space:nowrap; }
.sc-body{ font-size:14.5px; line-height:1.72; color:var(--ink2); margin:10px 0 0; word-break:keep-all; }
.tip{ display:flex; gap:10px; align-items:flex-start; margin-top:14px; padding:12px 14px; border-radius:16px; background:var(--soft); font-size:13.5px; line-height:1.6; color:var(--ink); word-break:keep-all; }
.tip svg{ width:18px; height:18px; flex:0 0 18px; margin-top:2px; color:var(--acc); }
.next{ margin-top:16px; }
.next-row{ display:flex; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--ink2); }
.next-row b{ color:var(--ink); font-weight:600; }
.bar{ height:5px; border-radius:99px; background:var(--track); margin-top:8px; overflow:hidden; }
.bar > i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--acc),var(--acc2)); transition:width 1s linear; }
.more{ display:flex; align-items:center; gap:6px; margin-top:14px; font-size:13px; color:var(--ink2); }
.more svg{ width:14px; height:14px; }
.poem{ text-align:center; font-family:var(--serif); font-weight:700; font-size:15px; color:var(--ink2); margin:26px 8px 4px; line-height:1.7; word-break:keep-all; }

/* ── 음식 ───────────────────────── */
.seg{ display:flex; gap:4px; padding:4px; border-radius:999px; background:var(--glass2); border:1px solid var(--line); margin:0 0 12px; overflow-x:auto; scrollbar-width:none; }
.seg::-webkit-scrollbar{ display:none; }
.seg button{ flex:1 0 auto; padding:8px 12px; border-radius:999px; font-size:13px; color:var(--ink2); white-space:nowrap; }
.seg button.on{ background:linear-gradient(135deg,var(--acc),var(--acc2)); color:var(--btnink); font-family:var(--serif); font-weight:700; font-size:14px; }
.f-search{ width:100%; height:44px; padding:0 16px; border-radius:999px; background:var(--soft); border:1px solid var(--line); font-size:16px; outline:none; margin-bottom:12px; }
.f-search:focus{ border-color:var(--acc); }
.f-search::placeholder{ color:var(--ink3); }
.food{ display:flex; gap:12px; align-items:flex-start; padding:13px 2px; border-bottom:1px solid var(--line); }
.food:last-child{ border-bottom:0; }
.food-ic{ width:42px; height:42px; flex:0 0 42px; border-radius:14px; display:grid; place-items:center; font-size:22px; background:var(--soft); }
.food-m{ flex:1; min-width:0; }
.food-n{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:15px; }
.food-n b{ font-family:var(--serif); font-weight:700; font-size:16px; }
.food-d{ font-size:13px; color:var(--ink2); line-height:1.6; margin-top:3px; word-break:keep-all; }
.badge{ font-size:11px; padding:2px 8px; border-radius:999px; white-space:nowrap; font-family:var(--sans); }
.badge.ok{ background:#c9f2df; color:#1f6b4c; }
.badge.gray{ background:#ffeab8; color:#80590c; }
.badge.no{ background:#ffd6dc; color:#9b2c40; }
.f-head{ display:flex; align-items:center; gap:8px; margin:4px 0 2px; }
.f-head h3{ font-family:var(--serif); font-weight:700; font-size:17px; margin:0; }
.f-rule{ font-size:13px; color:var(--ink2); line-height:1.65; word-break:keep-all; margin:0; }
.sos{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-top:12px; }
.sos div{ text-align:center; padding:10px 4px; border-radius:16px; background:var(--soft); font-size:12px; color:var(--ink2); line-height:1.4; }
.sos div span{ display:block; font-size:22px; margin-bottom:2px; }
.meal{ display:flex; gap:12px; padding:12px 0; border-bottom:1px dashed var(--line); }
.meal:last-child{ border-bottom:0; }
.meal-t{ flex:0 0 58px; font-family:var(--num); font-weight:500; font-size:14px; color:var(--acc); padding-top:2px; }
:root[data-tone="light"] .meal-t{ filter:brightness(.8) saturate(1.3); }
.meal-m{ flex:1; min-width:0; }
.meal-n{ font-size:15px; }
.meal-d{ font-size:12.5px; color:var(--ink2); line-height:1.6; margin-top:2px; word-break:keep-all; }
.plate{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.plate span{ font-size:12px; padding:3px 9px; border-radius:999px; background:var(--soft); color:var(--ink2); }

/* ── 몸의 변화 ───────────────────── */
.page-h{ font-family:var(--serif); font-weight:700; font-size:24px; margin:14px 0 4px; }
.page-sub{ font-size:13.5px; color:var(--ink2); line-height:1.65; margin:0 0 18px; word-break:keep-all; }
.tl{ position:relative; padding-left:30px; }
.tl::before{ content:''; position:absolute; left:10px; top:8px; bottom:8px; width:2px; border-radius:2px; background:linear-gradient(180deg, var(--ink4), transparent); }
.tl-fill{ position:absolute; left:10px; top:8px; width:2px; border-radius:2px; background:linear-gradient(180deg,var(--acc),var(--acc2)); box-shadow:0 0 10px var(--acc); }
.tl-item{ position:relative; margin-bottom:14px; }
.tl-node{ position:absolute; left:-26px; top:20px; width:14px; height:14px; border-radius:50%; background:var(--nodebg); border:2px solid var(--ink4); }
.tl-item.past .tl-node{ background:var(--acc); border-color:var(--acc); }
.tl-item.now .tl-node{ background:#fff; border-color:#fff; box-shadow:0 0 0 5px color-mix(in srgb, var(--acc) 35%, transparent), 0 0 18px var(--acc); }
.tl-item .card{ padding:16px; }
.tl-item.future .card{ background:var(--dim); }
.tl-item.future .tl-t, .tl-item.future .tl-b{ opacity:.78; }
.tl-h{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.tl-hr{ font-family:var(--serif); font-weight:700; font-size:13px; padding:3px 9px; border-radius:999px; background:var(--soft); }
.tl-now{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; color:#1b1434; background:linear-gradient(135deg,var(--acc),var(--acc2)); }
.tl-t{ font-family:var(--serif); font-weight:700; font-size:18px; margin:8px 0 0; }
.tl-b{ font-size:13.5px; line-height:1.7; color:var(--ink2); margin:6px 0 0; word-break:keep-all; }
.tl-item .tip{ margin-top:10px; font-size:13px; }
.caution{ border-color:rgba(255,190,170,.25); }
.caution h3{ font-family:var(--serif); font-weight:700; font-size:16px; margin:0 0 8px; }
.caution ul{ margin:0; padding-left:18px; font-size:13px; line-height:1.75; color:var(--ink2); }
.src{ font-size:11.5px; color:var(--ink3); line-height:1.6; margin-top:12px; }
.src a{ color:var(--ink2); }

/* ── 기록 ───────────────────────── */
.stats{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
.stat{ padding:14px; border-radius:20px; background:var(--glass); border:1px solid var(--line); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); min-width:0; }
.stat .k{ font-size:11.5px; color:var(--ink3); }
.stat .v{ font-family:var(--num); font-weight:500; font-size:24px; margin-top:4px; white-space:nowrap; }
.stat .v small{ font-family:var(--sans); font-weight:400; font-size:12px; color:var(--ink2); margin-left:3px; }
.sec-h{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
.sec-h h3{ font-family:var(--serif); font-weight:700; font-size:17px; margin:0; }
.mnav{ display:flex; align-items:center; gap:4px; }
.mnav button{ width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--glass2); }
.mnav svg{ width:14px; height:14px; }
.mnav span{ font-size:13.5px; min-width:76px; text-align:center; }
.cal{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:5px; }
.cal .dow{ font-size:10.5px; color:var(--ink3); text-align:center; padding-bottom:2px; }
.cal .d{ position:relative; aspect-ratio:1; min-width:0; border-radius:10px; display:grid; place-items:center; font-family:var(--num); font-size:11.5px; color:var(--ink2); background:var(--soft); }
.cal .d.lv1{ background:color-mix(in srgb, var(--acc) 18%, transparent); }
.cal .d.lv2{ background:color-mix(in srgb, var(--acc) 36%, transparent); color:var(--ink); }
.cal .d.lv3{ background:color-mix(in srgb, var(--acc) 58%, transparent); color:#fff; }
.cal .d.lv4{ background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#1b1434; font-weight:700; }
.cal .d.today{ box-shadow:inset 0 0 0 1.5px var(--ink2); }
.cal .d.sel{ outline:2px solid var(--ink); outline-offset:1px; }
.cal .d.ach::after{ content:''; position:absolute; top:4px; right:4px; width:4px; height:4px; border-radius:50%; background:#fff; }
.cal .d.lv4.ach::after{ background:#1b1434; }
.cal .d.out{ visibility:hidden; }
.legend{ display:flex; align-items:center; gap:5px; justify-content:flex-end; margin-top:10px; font-size:10.5px; color:var(--ink3); }
.legend i{ width:11px; height:11px; border-radius:3px; display:inline-block; }

.rec{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px 4px; border-bottom:1px solid var(--line); }
.rec:last-child{ border-bottom:0; }
.rec-ic{ width:40px; height:40px; flex:0 0 40px; border-radius:14px; display:grid; place-items:center; font-family:var(--num); font-weight:500; font-size:13px; background:var(--soft); }
.rec-ic.ok{ background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#1b1434; }
.rec-m{ flex:1; min-width:0; }
.rec-t{ font-size:14.5px; }
.rec-t b{ font-weight:700; }
.rec-s{ font-size:12px; color:var(--ink3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rec-g{ font-size:11.5px; color:var(--ink3); white-space:nowrap; }
.empty{ text-align:center; padding:22px 8px; font-size:13.5px; color:var(--ink3); line-height:1.7; }

.w-row{ display:flex; gap:8px; }
.w-row input{ flex:1; min-width:0; height:46px; padding:0 14px; border-radius:14px; background:var(--soft); border:1px solid var(--line); font-size:16px; outline:none; }
.w-row input:focus{ border-color:var(--acc); }
.w-row button{ flex:0 0 auto; height:46px; padding:0 18px; border-radius:14px; font-weight:700; color:#1b1434; background:linear-gradient(135deg,var(--acc),var(--acc2)); }
.w-chart{ width:100%; height:auto; display:block; margin-top:14px; }
.w-sum{ display:flex; justify-content:space-between; gap:8px; margin-top:8px; font-size:12.5px; color:var(--ink2); }
.w-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.w-chip{ display:flex; align-items:center; gap:6px; padding:5px 6px 5px 10px; border-radius:999px; background:var(--soft); font-size:12px; color:var(--ink2); }
.w-chip button{ width:20px; height:20px; border-radius:50%; display:grid; place-items:center; color:var(--ink3); }

/* ── 아래 메뉴 ───────────────────── */
.nav{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--sab) + 12px); width:min(calc(100% - 32px), 420px); height:var(--navh);
  display:flex; padding:6px; gap:4px; border-radius:24px; background:var(--navbg); border:1px solid var(--line); -webkit-backdrop-filter:blur(20px) saturate(1.2); backdrop-filter:blur(20px) saturate(1.2); z-index:20; }
.nav button{ flex:1 1 0; min-width:0; border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; color:var(--ink3); transition:background .25s, color .25s; }
.nav button svg{ width:21px; height:21px; }
.nav button.on{ color:var(--ink); background:var(--soft2); }
.nav button.on svg{ color:var(--acc); filter:drop-shadow(0 0 6px var(--acc)); }

/* ── 시트 ───────────────────────── */
.sheet-wrap{ position:fixed; inset:0; z-index:50; background:rgba(8,6,20,.55); opacity:0; pointer-events:none; transition:opacity .3s ease; display:flex; align-items:flex-end; justify-content:center; }
.sheet-wrap.open{ opacity:1; pointer-events:auto; }
.sheet{ width:100%; max-width:480px; max-height:88vh; overflow:auto; padding:10px 18px calc(var(--sab) + 22px); border-radius:28px 28px 0 0;
  background:var(--sheetbg); box-shadow:0 -10px 40px -10px rgba(20,10,60,.35); border:1px solid var(--line); border-bottom:0; transform:translateY(40px); transition:transform .35s cubic-bezier(.2,.8,.2,1); }
.sheet-wrap.open .sheet{ transform:none; }
.grab{ width:40px; height:4px; border-radius:4px; background:var(--ink4); margin:2px auto 14px; }
.sh-t{ font-family:var(--serif); font-weight:700; font-size:21px; margin:0 0 6px; }
.sh-s{ font-size:13.5px; color:var(--ink2); line-height:1.65; margin:0 0 16px; word-break:keep-all; }
.plans{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
.pl{ text-align:left; padding:14px; border-radius:20px; background:var(--soft); border:1px solid var(--line); min-width:0; }
.pl.on{ border-color:transparent; background:linear-gradient(135deg, color-mix(in srgb,var(--acc) 30%, transparent), color-mix(in srgb,var(--acc2) 22%, transparent)); box-shadow:inset 0 0 0 1.5px var(--acc); }
.pl-n{ font-family:var(--num); font-weight:500; font-size:22px; }
.pl-s{ font-size:12px; color:var(--ink2); margin-top:3px; }
.pl-d{ font-size:11px; color:var(--ink3); margin-top:6px; }
.pl.wide{ grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.step{ display:flex; align-items:center; gap:8px; }
.step button{ width:36px; height:36px; border-radius:50%; background:var(--soft2); font-size:18px; }
.step b{ font-family:var(--num); font-size:20px; min-width:46px; text-align:center; }
.field{ display:block; margin-bottom:14px; }
.field span{ display:block; font-size:12px; color:var(--ink3); margin-bottom:6px; }
.field input, .field textarea{ width:100%; padding:12px 14px; border-radius:14px; background:var(--soft); border:1px solid var(--line); font-size:16px; outline:none; }
.field textarea{ min-height:84px; resize:vertical; line-height:1.6; }
.field input:focus, .field textarea:focus{ border-color:var(--acc); }
.quick{ display:flex; flex-wrap:wrap; gap:6px; margin:-4px 0 14px; }
.quick button{ padding:7px 12px; border-radius:999px; background:var(--soft); font-size:12.5px; color:var(--ink2); }
.moods{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-bottom:14px; }
.mood{ display:flex; align-items:center; gap:8px; padding:11px 12px; border-radius:16px; background:var(--soft); border:1px solid var(--line); font-size:13.5px; text-align:left; min-width:0; }
.mood i{ width:10px; height:10px; border-radius:50%; flex:0 0 10px; }
.mood.on{ border-color:var(--acc); background:color-mix(in srgb, var(--acc) 18%, transparent); }
.big-dur{ text-align:center; margin:6px 0 4px; }
.big-dur .v{ font-family:var(--num); font-weight:500; font-size:44px; font-variant-numeric:tabular-nums; }
.big-dur .s{ font-size:13px; color:var(--ink2); margin-top:2px; }
.row-btns{ display:flex; gap:8px; margin-top:6px; }
.row-btns .primary{ margin-top:0; flex:1 1 0; min-width:0; height:52px; font-size:15.5px; }
.danger{ color:var(--danger); }
.set-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 2px; border-bottom:1px solid var(--line); width:100%; text-align:left; }
.set-row:last-child{ border-bottom:0; }
.set-row .k{ font-size:14.5px; }
.set-row .d{ font-size:12px; color:var(--ink3); margin-top:2px; line-height:1.5; }
.set-row .v{ font-size:13px; color:var(--ink2); white-space:nowrap; }
.sw{ width:46px; height:28px; flex:0 0 46px; border-radius:99px; background:var(--ink4); position:relative; transition:background .25s; }
.sw::after{ content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform .25s; }
.sw.on{ background:linear-gradient(135deg,var(--acc),var(--acc2)); }
.sw.on::after{ transform:translateX(18px); }
.toast{ position:fixed; left:50%; bottom:calc(var(--sab) + var(--navh) + 26px); transform:translate(-50%, 12px); max-width:calc(100% - 40px); padding:11px 18px; border-radius:999px;
  background:rgba(255,255,255,.94); color:#1b1434; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .3s, transform .3s; z-index:60; text-align:center; word-break:keep-all; }
.toast.show{ opacity:1; transform:translate(-50%, 0); }

@media (max-width:340px){
  .app{ padding-left:12px; padding-right:12px; }
  .stats{ gap:8px; }
  .stat .v{ font-size:20px; }
  .plans, .moods{ grid-template-columns:minmax(0,1fr); }
  .nav button span{ font-size:10px; }
  .card{ padding:15px; }
}
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>

/* ── 저장 ─────────────────────────── */
function fresh(){ return { v:1, planId:'16:8', customF:24, cur:null, lastEnd:null, fasts:[], weights:[], notify:false, chime:true, ack:false }; }
function normalize(d){
  const s = Object.assign(fresh(), d && typeof d === 'object' ? d : {});
  s.fasts = Array.isArray(s.fasts) ? s.fasts.filter(f => f && f.id && +f.start && +f.end && f.end > f.start) : [];
  s.weights = Array.isArray(s.weights) ? s.weights.filter(w => w && /^\d{4}-\d\d-\d\d$/.test(w.d) && +w.kg > 0) : [];
  if (s.cur && !(+s.cur.start > 0)) s.cur = null;
  if (s.cur && !(+s.cur.goal > 0)) s.cur.goal = 16;
  s.customF = Math.min(72, Math.max(10, +s.customF || 24));
  return s;
}
function load(){ try { const t = localStorage.getItem(KEY); return t ? normalize(JSON.parse(t)) : fresh(); } catch(e){ return fresh(); } }
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('저장 공간에 기록하지 못했어요'); } pushNative(); }

/* 안드로이드 앱(비움 APK) 안에서 열렸을 때: 위젯·알람이 쓸 상태를 앱에 넘겨요 */
const APP = (() => { try { return window.BiumAndroid && window.BiumAndroid.isApp() ? window.BiumAndroid : null; } catch(e){ return null; } })();
if (APP) document.documentElement.classList.add('in-app');
function pushNative(){
  if (!APP) return;
  try {
    const pl = plan();
    APP.sync(JSON.stringify({
      v:1, cur: S.cur ? { start:S.cur.start, goal:S.cur.goal } : null, lastEnd:S.lastEnd || 0,
      eatH: pl.e, planF: pl.f, planName: planName(pl), notify: !!S.notify,
      streak: (() => { const si = streakInfo(); return { n: si.n, count: si.count, live: si.live, exp: si.exp }; })(),
      stages: STAGES.map(s => ({ h:s.h, name:s.name, short:s.short, line: s.body.split('. ')[0].replace(/\.?$/, '.') }))
    }));
  } catch(e){}
}

function plan(){
  if (S.planId === 'custom') { const f = S.customF; return { id:'custom', f, e: f < 24 ? 24 - f : 0, sub:'나만의 단식' }; }
  return PLANS.find(p => p.id === S.planId) || PLANS[2];
}
const planName = p => p.id === 'custom' ? `${p.f}시간` : (p.id === '23:1' ? 'OMAD' : p.id);

/* ── 시간 도우미 ───────────────────── */
const pad = n => String(n).padStart(2, '0');
const dkey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
function hms(ms){ ms = Math.max(0, ms); const s = Math.floor(ms/1000); return `${Math.floor(s/3600)}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`; }
function dur(ms, short){
  ms = Math.max(0, ms); const m = Math.floor(ms/MIN); const h = Math.floor(m/60), r = m % 60;
  if (h === 0) return `${r}분`;
  if (r === 0 || short) return `${h}시간`;
  return `${h}시간 ${r}분`;
}
const clock = ts => new Date(ts).toLocaleTimeString('ko-KR', { hour:'numeric', minute:'2-digit' });
function dayWord(ts){
  const k = dkey(ts), now = Date.now();
  if (k === dkey(now)) return '오늘';
  if (k === dkey(now - DAY)) return '어제';
  if (k === dkey(now + DAY)) return '내일';
  const d = new Date(ts); return `${d.getMonth()+1}월 ${d.getDate()}일`;
}
const when = ts => `${dayWord(ts)} ${clock(ts)}`;
function toLocalInput(ts){ const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fromLocalInput(v){ const t = new Date(v).getTime(); return isNaN(t) ? null : t; }
const stageIdx = hrs => { let i = 0; STAGES.forEach((s, k) => { if (hrs >= s.h) i = k; }); return i; };
const rangeOf = i => STAGES[i+1] ? `${STAGES[i].h}–${STAGES[i+1].h}시간` : `${STAGES[i].h}시간 이상`;

/* ── 현재 상태 ─────────────────────── */
function phase(now){
  if (S.cur) {
    const el = now - S.cur.start, hrs = el / H, goalMs = S.cur.goal * H;
    return { p:'fast', el, hrs, i: stageIdx(hrs), goalMs, ach: el >= goalMs };
  }
  const pl = plan();
  if (S.lastEnd && pl.e > 0 && now - S.lastEnd < pl.e * H && now >= S.lastEnd) return { p:'eat', el: now - S.lastEnd, win: pl.e * H };
  return { p:'idle' };
}

    : mood === 'star' ? spark(4, 18, 7) + spark(96, 24, 6) + spark(10, 88, 5) + spark(92, 86, 7) : '';
  return `<svg class="mascot" viewBox="0 0 100 100" style="color:var(--ink)" aria-hidden="true">${defs}${body}${cheeks}${eyes}${mouth}${extra}</svg>`;
}

const R = 118, C = 2 * Math.PI * R;
let sig = '';
function polar(frac, r){ const a = frac * 2 * Math.PI - Math.PI/2; return [150 + r * Math.cos(a), 150 + r * Math.sin(a)]; }
const digits = t => esc(t); // 고정폭 숫자 글꼴이라 칸을 나눌 필요가 없어요
// 큰 글씨 설정에서도 시간이 링 밖으로 넘치지 않게, 넘치면 살짝 줄여요
let timeLen = -1;
function setTime(t){
  const el = $('#rcTime');
  el.innerHTML = digits(t);
  if (t.length !== timeLen) { timeLen = t.length; fitTime(); }
}
function fitTime(){
  const el = $('#rcTime'); if (!el || !el.offsetParent) return;
  el.style.transform = '';
  const box = el.parentElement.clientWidth * 0.94, w = el.offsetWidth;
  if (w > box && box > 0) el.style.transform = `scale(${(box / w).toFixed(3)})`;
}
/* 첫 화면이 아래 메뉴와 겹치지 않게: 계획 상자가 메뉴 위에서 끝나도록 필요하면 링을 줄여요 */
function fitHome(){
  if (view !== 'today') return;
  const rb = $('#ringBox'), times = $('#times'), nav = $('#nav');
  if (!rb || !times || !times.offsetParent) return;
  const bub = $('#bubble');
  rb.style.width = ''; bub.style.display = '';
  const overBy = () => times.getBoundingClientRect().bottom + window.scrollY - (nav.getBoundingClientRect().top - 12); // 맨 위로 올렸을 때 기준
  const shrink = min => {
    const over = overBy();
    if (over > 0) rb.style.width = Math.max(min, Math.floor(rb.getBoundingClientRect().width - over)) + 'px';
  };
  shrink(190);                                            // 1) 링을 조금 줄이고
  if (overBy() > 0) { bub.style.display = 'none'; shrink(190); } // 2) 그래도 넘치면 말풍선을 숨기고
  if (overBy() > 0) shrink(150);                          // 3) 마지막으로 링을 더 줄여요
  timeLen = -1; fitTime();
}
window.addEventListener('resize', () => { timeLen = -1; fitHome(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitHome());

      // 앱에서는 폰이 직접 정각에 알람을 울려요 → 알림만 켜져 있으면 됨
      ab.className = 'alarm-btn ' + (S.notify ? 'done' : 'todo');
      ab.innerHTML = S.notify ? `${IC.check}<span>${esc(clock(endAt))}에 알람이 울려요</span>` : `${IC.bell}<span>목표 시각에 알람 받기</span>`;
      ab.onclick = S.notify ? () => toast('목표 시각과 단계마다 폰 알림이 와요') : () => enableAppNotify();
    } else {
      const added = S.cur.cal === endAt;
      ab.className = 'alarm-btn ' + (added ? 'done' : 'todo');
      ab.innerHTML = added ? `${IC.check}<span>캘린더 알람 넣음 · ${esc(clock(endAt))}</span>` : `${IC.bell}<span>끝나는 시각에 알람 맞추기</span>`;
      ab.onclick = alarmSheet;
    }
  } else if (ph.p === 'eat') {
    ab.hidden = true;
    applyAccent(EAT_ACC);
    $('#mascot').innerHTML = mascotSvg('sun', 'happy');
    $('#bubble').textContent = '맛있게 먹어요! 채우는 시간도 소중해요';
    pill.innerHTML = `<span class="sp-dot">♥</span><b>먹는 시간</b><small>식사 팁</small>${IC.right}`;
    pill.onclick = eatSheet;
    times.innerHTML = `
      <div><div class="t-k">단식 마침</div><div class="t-v"><span>${esc(when(S.lastEnd))}</span></div></div>
      <div><div class="t-k">다음 단식</div><div class="t-v"><span>${esc(when(S.lastEnd + ph.win))}</span></div></div>`;
    btn.textContent = '단식 시작'; btn.classList.remove('soft');
    sub.hidden = false; sub.textContent = '이미 시작했어요 · 시작 시간 고르기'; sub.onclick = () => pickStartSheet();
  } else {
    ab.hidden = true;
    applyAccent(IDLE_ACC);
    $('#mascot').innerHTML = mascotSvg('moon', 'calm');
    $('#bubble').textContent = last ? '오늘도 가볍게, 함께 비워 볼까요?' : '안녕하세요! 저랑 같이 비워 볼까요?';
    pill.innerHTML = `<span class="sp-dot">✦</span><b>몸의 변화 미리 보기</b>${IC.right}`;
    pill.onclick = () => go('stages');
    times.innerHTML = `
      <button id="planBtn"><div class="t-k">단식 계획</div><div class="t-v"><span>${esc(planName(pl))} · ${pl.f}시간</span>${IC.down}</div></button>
      <div><div class="t-k">지난 단식</div><div class="t-v"><span>${last ? esc(dur(last.end - last.start)) + ' · ' + esc(dayWord(last.end)) : '아직 없어요'}</span></div></div>`;
    $('#planBtn').onclick = planSheet;
    btn.textContent = '단식 시작'; btn.classList.remove('soft');
    sub.hidden = false; sub.textContent = '이미 시작했어요 · 시작 시간 고르기'; sub.onclick = () => pickStartSheet();
  }
  sig = sigOf(ph);
  tickToday(now, ph);
  setTimeout(fitHome, 0);
}

/* 몸의 변화: 보고 싶을 때 눌러서 열어요 */
function stageSheet(){
  const ph = phase(Date.now());
  if (ph.p !== 'fast') return;
  const s = STAGES[ph.i], nx = STAGES[ph.i + 1];
  let next = '';
  if (nx) {
    const span = (nx.h - s.h) * H, done = ph.el - s.h * H;
    next = `<div class="next"><div class="next-row"><span>다음 · <b>${esc(nx.name)}</b></span><span>${esc(dur(nx.h * H - ph.el))} 남음</span></div>
      <div class="bar"><i style="width:${Math.min(100, done / span * 100).toFixed(1)}%"></i></div></div>`;
  }
  openSheet(`
    <div class="sc-top"><div class="eyebrow">지금 몸은 · ${esc(dur(ph.el))}째</div><div class="sc-range">${esc(rangeOf(ph.i))}</div></div>
    <div class="sc-title">${esc(s.name)}</div>
    <p class="sc-body">${esc(s.body)}</p>
    <div class="tip">${IC.leaf}<div>${esc(s.tip)}</div></div>
    ${next}
    <button class="primary soft" id="allStages" style="margin-top:20px">모든 단계 보기</button>`, () => {
    $('#allStages').onclick = () => { closeSheet(); go('stages'); };
  });
}
function eatSheet(){
  const last = S.fasts[S.fasts.length - 1];
  openSheet(`
    <div class="eyebrow">먹는 시간</div>
    <div class="sc-title">잘 먹는 것도 단식의 일부예요</div>
    <p class="sc-body">단식을 마친 뒤 첫 식사는 부드럽고 따뜻한 것부터 천천히 시작해 보세요. 단백질과 채소를 넉넉히, 물도 충분히 마셔 주세요.</p>
    ${last ? `<div class="tip">${IC.leaf}<div>지난 단식 <b>${esc(dur(last.end - last.start))}</b> · ${esc(STAGES[stageIdx((last.end - last.start) / H)].name)}까지 닿았어요.</div></div>` : ''}
    <button class="primary soft" id="eatClose" style="margin-top:20px">알겠어요</button>`, () => {
    $('#eatClose').onclick = closeSheet;
  });
}

const sigOf = ph => ph.p === 'fast' ? `f${ph.i}${ph.ach ? 'a' : ''}${S.cur.goal}${S.cur.start}${S.notify}` : ph.p + (S.lastEnd || '') + S.planId + S.customF + S.fasts.length;

function tickToday(now, ph){
  let frac = 0;
  if (ph.p === 'fast') {
    frac = Math.min(1, ph.el / ph.goalMs);
    setTime(hms(ph.el));
    $('#rcSub').innerHTML = ph.ach
      ? `<b>목표 달성 ✦</b> +${esc(dur(ph.el - ph.goalMs))}`
      : `목표까지 <b>${esc(dur(ph.goalMs - ph.el))}</b>`;
  } else if (ph.p === 'eat') {
    frac = Math.min(1, ph.el / ph.win);
    setTime(hms(ph.win - ph.el));
    $('#rcSub').innerHTML = `다음 단식까지`;
  } else {
    const pl = plan();
    setTime(`${pl.f}:00:00`);
    $('#rcSub').innerHTML = `<b>${esc(planName(pl))}</b> 비움 준비 완료`;
  }
  $('#prog').setAttribute('stroke-dashoffset', (C * (1 - frac)).toFixed(2));
  $('#prog').style.opacity = frac > 0 ? 1 : 0;
  const [ox, oy] = polar(frac, R);
  const orb = $('#orb'); orb.setAttribute('cx', ox.toFixed(2)); orb.setAttribute('cy', oy.toFixed(2));
  orb.style.opacity = ph.p === 'idle' ? 0 : 1;
}

function foodListHtml(){
  const q = foodQuery.trim().replace(/\s/g, '');
  const items = FOODS.filter(f => (foodFilter === 'all' || f.g === foodFilter) && (!q || (f.n + f.d).replace(/\s/g, '').includes(q)));
  const groups = foodFilter === 'all' ? ['ok', 'gray', 'no'] : [foodFilter];
  let list = '';

    if (!its.length) return;
    list += `<div class="card"><div class="f-head"><span class="badge ${g}">${FG[g][0]}</span><h3>${g === 'ok' ? '마셔도 돼요' : g === 'gray' ? '상황에 따라 달라요' : '먹는 시간에 드세요'}</h3></div>

  });
  if (!list) list = `<div class="card"><div class="empty">‘${esc(foodQuery)}’에 맞는 항목이 없어요.<br>열량이 있다면 대부분 단식이 깨진다고 보면 돼요.</div></div>`;
  return list;
}

let calY, calM, selDay = null, showAll = false;
const latestEnd = () => S.fasts.length ? S.fasts.reduce((a, x) => Math.max(a, x.end), 0) : null;
function achieved(f){ return f.end - f.start >= (f.goal || 0) * H - 1000; }
function streak(){ return streakInfo().n; }
/* 연속 기록: 목표를 달성한 날(단식을 마친 날 기준)이 며칠째 이어지는지
   n: 이어진 날 수 / count: 지금 단식 중이면 오늘까지 친 날째 / live: 오늘 도전 중 / exp: 이 기록이 끊기는 시각 */
function streakInfo(){
  const set = new Set(S.fasts.filter(achieved).map(f => dkey(f.end)));
  const now = Date.now(), today = dkey(now);
  let t = now; if (!set.has(today)) t -= DAY;
  let n = 0, last = 0;
  while (set.has(dkey(t))) { if (!last) last = t; n++; t -= DAY; }
  const live = !!S.cur && !set.has(today);
  let exp = 0;
  if (last) { const d = new Date(last); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + 2); exp = d.getTime(); }
  return { n, count: live ? n + 1 : n, live, exp };
}
const MILESTONES = { 3:'3일 연속! 몸이 리듬을 익히고 있어요', 7:'일주일 연속! 정말 대단해요', 14:'2주 연속! 이제 습관이 됐어요',
  21:'3주 연속! 21일의 기적이에요', 30:'한 달 연속! 스스로를 꼭 안아 주세요', 50:'50일 연속! 놀라운 꾸준함이에요', 100:'100일 연속! 전설이 되었어요' };
function streakText(si){
  if (si.live) return si.count === 1 ? '🔥 오늘 1일째 도전 중' : `🔥 연속 ${si.count}일째 비움 중`;
  if (si.n > 0) return `🔥 연속 ${si.n}일 달성`;
  return '';
}
function renderStreak(){
  const si = streakInfo(), el = $('#streak'), txt = streakText(si);
  el.innerHTML = txt
    ? `<button class="streak-pill${MILESTONES[si.count] ? ' mile' : ''}">${esc(txt)}${MILESTONES[si.count] && !si.live ? ' ✦' : ''}</button>`
    : `<button class="streak-pill soft">✦ 오늘부터 1일, 시작해 볼까요?</button>`;
  el.firstChild.onclick = () => go('log');
}
function renderLog(){
  const now = new Date();
  if (calY == null) { calY = now.getFullYear(); calM = now.getMonth(); }
  const fs = S.fasts.slice().sort((a, b) => b.end - a.end);
  const thisMonth = fs.filter(f => { const d = new Date(f.end); return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); }).length;
  const recent = fs.slice(0, 30);
  const avg = recent.length ? recent.reduce((a, f) => a + (f.end - f.start), 0) / recent.length / H : 0;
  const longest = fs.reduce((a, f) => Math.max(a, f.end - f.start), 0);

  // 달력
  const byDay = {};
  S.fasts.forEach(f => { const k = dkey(f.end); (byDay[k] = byDay[k] || { ms:0, ach:false, list:[] }); byDay[k].ms += f.end - f.start; byDay[k].ach = byDay[k].ach || achieved(f); byDay[k].list.push(f); });
  const first = new Date(calY, calM, 1), days = new Date(calY, calM + 1, 0).getDate(), lead = first.getDay();
  let cal = ['일','월','화','수','목','금','토'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let k = 0; k < lead; k++) cal += `<div class="d out"></div>`;
  const tk = dkey(Date.now());
  for (let d = 1; d <= days; d++) {
    const k = `${calY}-${pad(calM+1)}-${pad(d)}`, info = byDay[k];
    const h = info ? info.ms / H : 0;
    const lv = !info ? 0 : h < 12 ? 1 : h < 16 ? 2 : h < 20 ? 3 : 4;
    cal += `<button class="d lv${lv}${info && info.ach ? ' ach' : ''}${k === tk ? ' today' : ''}${k === selDay ? ' sel' : ''}" data-day="${k}" aria-label="${calM+1}월 ${d}일">${d}</button>`;
  }
  let dayList = '';
  if (selDay) {
    const info = byDay[selDay]; const [, mm, dd] = selDay.split('-');
    dayList = `<div style="margin-top:14px"><div class="eyebrow" style="margin-bottom:4px">${+mm}월 ${+dd}일</div>${info ? info.list.sort((a,b)=>a.start-b.start).map(recHtml).join('') : '<div class="empty" style="padding:10px">이날은 기록이 없어요</div>'}</div>`;
  }

  const listItems = (showAll ? fs : fs.slice(0, 8)).map(recHtml).join('');
  $('#v-log').innerHTML = `
    <h2 class="page-h">기록</h2>
    <p class="page-sub">비워낸 시간들이 차곡차곡 쌓이고 있어요.</p>
    <div class="stats">
      <div class="stat"><div class="k">연속 달성</div><div class="v">${streak()}<small>일</small></div></div>
      <div class="stat"><div class="k">이번 달 단식</div><div class="v">${thisMonth}<small>회</small></div></div>
      <div class="stat"><div class="k">평균 단식</div><div class="v">${avg ? avg.toFixed(1) : '–'}<small>${avg ? '시간' : ''}</small></div></div>
      <div class="stat"><div class="k">가장 긴 단식</div><div class="v">${longest ? (longest / H).toFixed(1) : '–'}<small>${longest ? '시간' : ''}</small></div></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="sec-h"><h3>비움 달력</h3>
        <div class="mnav"><button id="mPrev" aria-label="이전 달">${IC.left}</button><span>${calY}년 ${calM+1}월</span><button id="mNext" aria-label="다음 달">${IC.right}</button></div></div>
      <div class="cal">${cal}</div>
      <div class="legend">짧게 <i style="background:color-mix(in srgb,var(--acc) 18%,transparent)"></i><i style="background:color-mix(in srgb,var(--acc) 36%,transparent)"></i><i style="background:color-mix(in srgb,var(--acc) 58%,transparent)"></i><i style="background:linear-gradient(135deg,var(--acc),var(--acc2))"></i> 길게 · 점 = 목표 달성</div>
      ${dayList}
    </div>
    <div class="card">
      <div class="sec-h"><h3>몸무게</h3><span class="muted" style="font-size:12px">선택 기록</span></div>
      <div class="w-row"><input id="wIn" type="number" inputmode="decimal" step="0.1" min="20" max="300" placeholder="오늘 몸무게 (kg)"><button id="wAdd">기록</button></div>
      ${weightChart()}
    </div>
    <div class="card">
      <div class="sec-h"><h3>지난 단식</h3><span class="muted" style="font-size:12px">${fs.length}회</span></div>
      ${fs.length ? listItems : '<div class="empty">아직 기록이 없어요.<br>첫 단식을 마치면 여기에 남아요.</div>'}
      ${fs.length > 8 ? `<button class="link" id="moreRec">${showAll ? '접기' : `전체 ${fs.length}개 보기`}</button>` : ''}
    </div>`;

  $('#mPrev').onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } selDay = null; renderLog(); };
  $('#mNext').onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } selDay = null; renderLog(); };
  document.querySelectorAll('#v-log .d[data-day]').forEach(b => b.onclick = () => { selDay = selDay === b.dataset.day ? null : b.dataset.day; renderLog(); });
  document.querySelectorAll('#v-log [data-rec]').forEach(b => b.onclick = () => editRecSheet(b.dataset.rec));
  document.querySelectorAll('#v-log [data-wdel]').forEach(b => b.onclick = () => { S.weights = S.weights.filter(w => w.d !== b.dataset.wdel); save(); renderLog(); });
  const more = $('#moreRec'); if (more) more.onclick = () => { showAll = !showAll; renderLog(); };
  const wIn = $('#wIn');
  wIn.oninput = () => { try { sessionStorage.setItem('bium_w_draft', wIn.value); } catch(e){} };
  try { const dft = sessionStorage.getItem('bium_w_draft'); if (dft) wIn.value = dft; } catch(e){}
  $('#wAdd').onclick = () => {
    const kg = parseFloat(String(wIn.value).replace(',', '.'));
    if (!(kg > 20 && kg < 300)) { toast('몸무게를 kg 단위로 적어 주세요'); return; }
    const d = dkey(Date.now());
    S.weights = S.weights.filter(w => w.d !== d); S.weights.push({ d, kg: Math.round(kg * 10) / 10 });
    S.weights.sort((a, b) => a.d < b.d ? -1 : 1); save();
    try { sessionStorage.removeItem('bium_w_draft'); } catch(e){}
    toast('오늘의 몸무게를 남겼어요'); renderLog();
  };
}
function recHtml(f){
  const ms = f.end - f.start, ok = achieved(f), md = moodOf(f.mood);
  return `<button class="rec" data-rec="${esc(f.id)}">
    <div class="rec-ic${ok ? ' ok' : ''}">${Math.floor(ms / H)}h</div>
    <div class="rec-m"><div class="rec-t"><b>${esc(dur(ms))}</b> ${md ? `<span class="muted" style="font-size:12px">· ${esc(md[1])}</span>` : ''}</div>
      <div class="rec-s">${esc(when(f.start))} → ${esc(clock(f.end))}${f.note ? ' · ' + esc(f.note) : ''}</div></div>
    <div class="rec-g">${ok ? '달성' : `목표 ${f.goal || '–'}h`}</div></button>`;
}
function weightChart(){
  const ws = S.weights.slice(-30);
  if (!ws.length) return '<div class="empty" style="padding:16px 8px 4px">몸무게를 남기면 흐름을 그려 드릴게요.</div>';
  const W = 300, Hh = 110, pX = 10, pY = 14;
  const vals = ws.map(w => w.kg), mn = Math.min(...vals), mx = Math.max(...vals), span = Math.max(.6, mx - mn);
  const pts = ws.map((w, k) => [pX + (ws.length === 1 ? (W - 2*pX) / 2 : k * (W - 2*pX) / (ws.length - 1)), pY + (1 - (w.kg - mn + (span - (mx - mn)) / 2) / span) * (Hh - 2*pY)]);
  const line = pts.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = `${line} L${pts[pts.length-1][0].toFixed(1)} ${Hh} L${pts[0][0].toFixed(1)} ${Hh} Z`;
  const diff = ws.length > 1 ? Math.round((ws[ws.length-1].kg - ws[0].kg) * 10) / 10 : 0;
  const last = pts[pts.length - 1];
  return `<svg class="w-chart" viewBox="0 0 ${W} ${Hh}" aria-label="몸무게 그래프">
      <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc);stop-opacity:.38"/><stop offset="1" style="stop-color:var(--acc);stop-opacity:0"/></linearGradient></defs>
      <path d="${area}" fill="url(#wg)"/>
      <path d="${line}" fill="none" style="stroke:var(--acc)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="#fff"/>
    </svg>
    <div class="w-sum"><span>최근 <b style="color:var(--ink)">${ws[ws.length-1].kg}kg</b></span><span>${ws.length > 1 ? `${ws.length}번의 기록 동안 ${diff > 0 ? '+' : ''}${diff}kg` : '첫 기록이에요'}</span></div>
    <div class="w-list">${ws.slice(-5).reverse().map(w => `<span class="w-chip">${+w.d.slice(5,7)}/${+w.d.slice(8)} · ${w.kg}kg<button data-wdel="${w.d}" aria-label="삭제">${IC.x}</button></span>`).join('')}</div>`;
}

function planSheet(){

function ackSheet(then){
  openSheet(`
    <h3 class="sh-t">시작하기 전에, 잠깐만요</h3>
    <p class="sh-s">간헐적 단식은 건강한 성인에게 비교적 안전하다고 알려져 있지만, 아래에 해당한다면 먼저 의사와 상의해 주세요.</p>
    <div class="card caution" style="padding:16px"><ul style="margin:0">
      <li>임신 중이거나 수유 중</li><li>당뇨약·인슐린·혈압약 등 복용 중</li><li>섭식장애 경험이 있거나 저체중</li><li>성장기 청소년, 만성질환</li></ul></div>
    <p class="sh-s" style="margin-top:14px">단식 중 어지러움, 심한 두근거림, 식은땀이 나면 바로 멈추고 천천히 드세요. 비움은 건강 정보를 안내할 뿐, 의학적 조언을 대신하지 않아요.</p>
    <button class="primary" id="ackOk">알겠어요, 시작할게요</button>`, () => {
    $('#ackOk').onclick = () => { S.ack = true; save(); closeSheet(); then(); };
  });
}

function startFast(at){
  if (!S.ack) { ackSheet(() => startFast(at)); return; }
  const start = Math.min(at || Date.now(), Date.now());
  S.cur = { start, goal: plan().f }; resetSeen();
  save(); renderAll();
  toast(at ? `${when(start)}부터 단식 중이에요` : '비움을 시작했어요. 천천히, 가볍게.');
  if (APP && !S.notify && !S.askedNotify) { S.askedNotify = true; save(); setTimeout(() => enableAppNotify(), 1200); }
  else if (S.notify) ensurePermission();
}

/* ── 캘린더 알람 ─────────────────────── */
const icsTime = ts => new Date(ts).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
// 캘린더 파일 규칙: 한 줄이 75바이트를 넘으면 접어서 이어 써요 (한글이 중간에 잘리지 않게)
function icsFold(line){
  const enc = new TextEncoder(); let out = '', cur = '', n = 0;
  for (const ch of line) {
    const b = enc.encode(ch).length;
    if (n + b > (out ? 74 : 75)) { out += (out ? '\r\n ' : '') + cur; cur = ''; n = 0; }
    cur += ch; n += b;
  }
  return out ? out + '\r\n ' + cur : cur;
}
function alarmSheet(){

  const detail = `${goal}시간 단식 목표에 닿았어요. 수고했어요! 비움 앱에서 단식을 마쳐 주세요. https://enjukim.github.io/bium/`;

    <div class="tip" style="margin-top:14px">${IC.leaf}<div>목표 시간이나 시작 시각을 바꾸면, 알람도 다시 넣어 주세요.</div></div>`, () => {
    const mark = () => { if (S.cur) { S.cur.cal = end; save(); } closeSheet(); renderAll(); };
    $('#alIcs').onclick = () => {
      const ics = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//bium//fasting//KO', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
        'BEGIN:VEVENT',
        `UID:bium-${S.cur.start}-${goal}@enjukim.github.io`,
        `DTSTAMP:${icsTime(Date.now())}`,

      ].map(icsFold).join('\r\n');
      try {

        a.href = URL.createObjectURL(new Blob([ics], { type:'text/calendar;charset=utf-8' }));
        a.download = `bium-${dkey(end)}-${pad(new Date(end).getHours())}${pad(new Date(end).getMinutes())}.ics`;

      } catch(e){ toast('파일을 만들지 못했어요. 구글 캘린더로 넣어 주세요'); }
    };
    $('#alG').onclick = () => {
      const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        + '&text=' + encodeURIComponent(title)
        + '&dates=' + icsTime(end) + '/' + icsTime(end + 15 * MIN)
        + '&details=' + encodeURIComponent(detail);
      window.open(url, '_blank', 'noopener');
      mark();
    };
  });
}

/* ── 차임 소리 (앱이 열려 있을 때) ───── */
let actx = null;
function audio(){
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; actx = new AC(); }
    if (actx.state === 'suspended') actx.resume().catch(() => {});
    return actx;
  } catch(e){ return null; }
}
// 폰은 화면을 한 번 만진 뒤에야 소리를 낼 수 있어서, 터치할 때마다 소리 장치를 깨워 둬요
document.addEventListener('pointerdown', () => { if (S.chime) audio(); }, { passive:true });
function bell(ctx, t, f, vol, len){
  [[1, 1], [2.01, .3], [3.02, .1], [4.2, .05]].forEach(([m, a]) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f * m;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol * a, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len / Math.pow(m, 0.5));
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + len + 0.1);
  });
}
function chime(kind, force){
  if (!S.chime && !force) return;
  const ctx = audio(); if (!ctx) return;
  const t = ctx.currentTime + 0.05;
  if (kind === 'goal') [659.25, 830.61, 987.77, 1318.51].forEach((f, k) => bell(ctx, t + k * 0.32, f, .2, 3));
  else { bell(ctx, t, 880, .14, 2.2); bell(ctx, t + 0.34, 1174.66, .1, 2.4); }
}

/* ── 알림 ───────────────────────────── */
async function ensurePermission(){
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  try { return (await Notification.requestPermission()) === 'granted'; } catch(e){ return false; }
}
function notify(title, body, kind){
  toast(title);
  chime(kind);
  if (APP) { try { APP.vibrate(kind || 'stage'); } catch(e){} return; } // 앱을 닫았을 때 알림은 안드로이드가 직접 보내요
  try { navigator.vibrate && navigator.vibrate(kind === 'goal' ? [200, 100, 200, 100, 400] : [90, 60, 90]); } catch(e){}
  if (!S.notify || !('Notification' in window) || Notification.permission !== 'granted') return;
  const opt = { body, icon:'icon-192.png', badge:'icon-192.png', tag:'bium-stage' };
  const fallback = () => { try { new Notification(title, opt); } catch(e){} };
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
    navigator.serviceWorker.getRegistration().then(r => r ? r.showNotification(title, opt) : fallback()).catch(fallback);
  } else fallback();
}
function resetSeen(){
  if (!S.cur) return;
  const hrs = (Date.now() - S.cur.start) / H;
  S.cur.seen = STAGES.map((s, k) => k).filter(k => hrs >= STAGES[k].h);
  S.cur.goalSeen = hrs >= S.cur.goal;
}
function checkMilestones(ph){
  if (ph.p !== 'fast') return;
  const cur = S.cur; if (!Array.isArray(cur.seen)) resetSeen();
  let changed = false;
  if (!cur.seen.includes(ph.i)) {
    cur.seen.push(ph.i); changed = true;
    const s = STAGES[ph.i];
    if (!(cur.goalSeen === false && ph.ach)) notify(`${s.h}시간 · ${s.name}`, s.body.split('. ')[0] + '.', 'stage');
  }
  if (!cur.goalSeen && ph.ach) { cur.goalSeen = true; changed = true; notify(`목표 ${cur.goal}시간 달성 ✦`, '정말 잘했어요. 이제 천천히 마쳐도 좋아요.', 'goal'); }
  if (changed) save();
}

/* ── 공통 ───────────────────────────── */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
let view = 'today';
function go(v){
  view = v;
  ['today','food','stages','log'].forEach(k => { $('#v-' + k).hidden = k !== v; });
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  if (v === 'food') renderFood();
  if (v === 'stages') renderStages();
  if (v === 'log') renderLog();
  if (v === 'today') { timeLen = -1; renderToday(); }
  window.scrollTo({ top:0 });
}
function bindGo(root){ root.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go)); }
function renderAll(){
  applySky(true);
  renderToday();
  if (view === 'stages') renderStages();
  if (view === 'log') renderLog();
}

document.querySelectorAll('#nav button').forEach(b => b.onclick = () => go(b.dataset.view));
$('#btnSettings').onclick = settingsSheet;
$('#mainBtn').onclick = () => { if (S.cur) endSheet(); else startFast(); };

function tick(){
  const now = Date.now(), ph = phase(now);
  checkMilestones(ph);
  applySky();
  if (sigOf(ph) !== sig) { renderToday(); if (view === 'stages') renderStages(); return; }
  if (view === 'today') tickToday(now, ph);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S = load(); renderAll(); checkUpdate(); } });

/* 새 판 확인: 앱을 다시 볼 때 서버에 새 판이 있으면 화면을 새로 불러와요
   (앱이 메모리에 남아 있으면 예전 화면이 계속 보이는 문제 방지) */
let lastCheck = 0;
async function checkUpdate(){
  if (!/^https?:$/.test(location.protocol) || Date.now() - lastCheck < 60 * 1000) return;
  lastCheck = Date.now();
  try {
    const res = await fetch(location.pathname + '?check=' + Date.now(), { cache:'no-store' });
    const m = (await res.text()).match(/const BUILD = '([^']+)'/);
    if (!m || m[1] === BUILD) return;
    if ($('#sheetWrap').classList.contains('open')) { lastCheck = 0; return; } // 무언가 적는 중이면 다음에
    try { sessionStorage.setItem('bium_updated', m[1]); } catch(e){}
    location.reload();
  } catch(e){}
}
setTimeout(checkUpdate, 3000);
try { if (sessionStorage.getItem('bium_updated')) { sessionStorage.removeItem('bium_updated'); setTimeout(() => toast('새 버전으로 바뀌었어요 ✦'), 600); } } catch(e){}
window.addEventListener('storage', e => { if (e.key === KEY) { S = load(); renderAll(); } });

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
makeStars();
renderAll();
setInterval(tick, 1000);

// 홈 화면 바로가기·위젯 버튼: ?a=start / ?a=end
function biumAction(a){
  if (a === 'start') { go('today'); if (!S.cur) startFast(); }
  if (a === 'end') { go('today'); if (S.cur) endSheet(); }
}
window.biumAction = biumAction;
// 안드로이드 뒤로 가기: 열린 시트 닫기 → 오늘 화면으로 → (그다음엔 앱이 알아서)
window.biumBack = () => {
  if ($('#sheetWrap').classList.contains('open')) { closeSheet(); return true; }
  if (view !== 'today') { go('today'); return true; }
  return false;
};
window.biumRefresh = () => { S = load(); renderAll(); pushNative(); checkUpdate(); };
(function(){
  const a = new URLSearchParams(location.search).get('a');
  if (a) history.replaceState(null, '', location.pathname);
  if (a === 'start' || a === 'end') biumAction(a);
})();
pushNative();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
