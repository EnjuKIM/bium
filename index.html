<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>비움 — 간헐적 단식</title>
<meta name="description" content="비워낸 시간만큼 가벼워지는, 감성 간헐적 단식 기록">
<meta name="theme-color" content="#1d1940" id="metaTheme">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@property --s1 { syntax:'<color>'; inherits:true; initial-value:#1d1940; }
@property --s2 { syntax:'<color>'; inherits:true; initial-value:#3e3470; }
@property --s3 { syntax:'<color>'; inherits:true; initial-value:#7d6aa8; }
@property --acc { syntax:'<color>'; inherits:true; initial-value:#cbbcff; }
@property --acc2 { syntax:'<color>'; inherits:true; initial-value:#ffc2dc; }

:root{
  --ink:#f7f2ff; --ink2:rgba(247,242,255,.74); --ink3:rgba(247,242,255,.5); --ink4:rgba(247,242,255,.22);
  --glass:rgba(16,12,38,.36); --glass2:rgba(255,255,255,.07); --line:rgba(255,255,255,.11);
  --serif:'Gowun Batang', 'Nanum Myeongjo', serif;
  --sans:'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --navh:64px;
  color-scheme:dark;
}
html{ transition:--s1 2.4s ease, --s2 2.4s ease, --s3 2.4s ease, --acc 2.4s ease, --acc2 2.4s ease; background:#140f30; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{ margin:0; min-height:100vh; font-family:var(--sans); color:var(--ink); background:transparent;-webkit-font-smoothing:antialiased; overflow-x:hidden; }
button{ font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0; }
input,textarea{ font:inherit; color:var(--ink); }
[hidden]{ display:none !important; }

/* ── 하늘 ───────────────────────── */
.sky{ position:fixed; inset:0; z-index:-4; background:linear-gradient(180deg, var(--s1) 0%, var(--s2) 55%, var(--s3) 100%); }
.glow{ position:fixed; z-index:-3; width:120vw; height:120vw; max-width:760px; max-height:760px; left:50%; top:-22vw; transform:translateX(-50%);
  background:radial-gradient(closest-side, color-mix(in srgb, var(--acc) 26%, transparent), transparent 70%); filter:blur(10px); pointer-events:none; }
.stars{ position:fixed; inset:0 0 30% 0; z-index:-2; pointer-events:none; transition:opacity 2.4s ease; }
.stars i{ position:absolute; border-radius:50%; background:#fff; animation:tw var(--d,4s) ease-in-out infinite; animation-delay:var(--dl,0s); }
@keyframes tw{ 0%,100%{opacity:.15} 50%{opacity:.95} }
.hills{ position:fixed; left:0; right:0; bottom:0; width:100%; height:26vh; z-index:-1; pointer-events:none; }

/* ── 뼈대 ───────────────────────── */
.app{ max-width:460px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px calc(var(--navh) + env(safe-area-inset-bottom) + 28px); }
.top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; }
.brand{ font-family:var(--serif); font-weight:700; font-size:24px; letter-spacing:.06em; }
.brand small{ font-family:var(--sans); font-weight:400; font-size:11px; letter-spacing:.02em; color:var(--ink3); margin-left:6px; }
.date{ font-size:12.5px; color:var(--ink3); margin-top:2px; }
.icon-btn{ width:42px; height:42px; flex:0 0 42px; border-radius:50%; display:grid; place-items:center; background:var(--glass2); border:1px solid var(--line); }
.icon-btn svg{ width:20px; height:20px; }

.card{ background:var(--glass); border:1px solid var(--line); border-radius:24px; padding:18px; -webkit-backdrop-filter:blur(18px) saturate(1.15); backdrop-filter:blur(18px) saturate(1.15); }
.card + .card{ margin-top:14px; }
.eyebrow{ font-size:11.5px; letter-spacing:.14em; color:var(--ink3); text-transform:uppercase; }
.h-serif{ font-family:var(--serif); font-weight:700; }
.muted{ color:var(--ink3); }
.view{ animation:fadeUp .5s ease both; }
@keyframes fadeUp{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

/* ── 오늘 ───────────────────────── */
.plan-chip{ display:flex; align-items:center; gap:8px; margin:10px auto 0; padding:8px 14px 8px 12px; border-radius:999px; background:var(--glass2); border:1px solid var(--line); font-size:13px; color:var(--ink2); }
.plan-chip b{ color:var(--ink); font-weight:700; letter-spacing:.02em; }
.plan-chip .dot{ width:7px; height:7px; border-radius:50%; background:linear-gradient(135deg,var(--acc),var(--acc2)); box-shadow:0 0 10px var(--acc); }
.plan-chip svg{ width:14px; height:14px; opacity:.6; }

.ring-box{ position:relative; width:min(100%, 320px); aspect-ratio:1; margin:8px auto 0; }
.ring{ width:100%; height:100%; display:block; overflow:visible; }
.ring .track{ fill:none; stroke:rgba(255,255,255,.08); stroke-width:12; }
.ring .inner{ fill:none; stroke:rgba(255,255,255,.12); stroke-width:1; stroke-dasharray:1 6.2; }
.ring .prog{ fill:none; stroke:url(#rg); stroke-width:12; stroke-linecap:round; transform:rotate(-90deg); transform-origin:150px 150px; transition:stroke-dashoffset 1s linear; filter:drop-shadow(0 0 8px color-mix(in srgb, var(--acc) 55%, transparent)); }
.ring .mk{ fill:rgba(255,255,255,.28); stroke:rgba(20,14,44,.7); stroke-width:2; }
.ring .mk.on{ fill:#fff; }
.ring .mkl{ font-family:var(--sans); font-size:10px; fill:var(--ink3); text-anchor:middle; dominant-baseline:middle; }
.ring .mkl.on{ fill:var(--ink); font-weight:700; }
.ring .orb{ fill:#fff; filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px var(--acc)); }
.ring-box.ach .prog{ animation:breathe 3s ease-in-out infinite; }
@keyframes breathe{ 0%,100%{ filter:drop-shadow(0 0 6px color-mix(in srgb, var(--acc) 50%, transparent)); } 50%{ filter:drop-shadow(0 0 18px var(--acc)); } }
.ring-center{ position:absolute; inset:18%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:4px; }
.rc-label{ font-size:12.5px; color:var(--ink2); letter-spacing:.04em; }
.rc-time{ font-weight:200; font-size:clamp(30px, 12.5vw, 50px); letter-spacing:.01em; font-variant-numeric:tabular-nums; line-height:1.08; }
.rc-sub{ font-size:12.5px; color:var(--ink2); line-height:1.45; }
.rc-sub b{ color:var(--ink); font-weight:600; }
.rc-stage{ margin-top:6px; font-family:var(--serif); font-size:14px; padding:4px 12px; border-radius:999px; background:rgba(255,255,255,.08); color:var(--ink); }

.times{ display:flex; gap:10px; margin:6px 0 0; }
.times > div{ flex:1 1 0; min-width:0; padding:11px 12px; border-radius:16px; background:var(--glass2); border:1px solid var(--line); }
.times .t-k{ font-size:11px; color:var(--ink3); letter-spacing:.06em; }
.times .t-v{ font-size:14px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.times .t-edit{ display:flex; justify-content:space-between; align-items:center; gap:4px; }
.times .t-edit svg{ width:13px; height:13px; opacity:.55; flex:0 0 auto; }

.primary{ display:block; width:100%; height:58px; margin-top:16px; border-radius:999px; font-size:17px; font-weight:700; letter-spacing:.04em; color:#1b1434;
  background:linear-gradient(135deg, var(--acc), var(--acc2)); box-shadow:0 14px 34px -14px var(--acc), inset 0 1px 0 rgba(255,255,255,.5); transition:transform .15s ease; }
.primary:active{ transform:scale(.98); }
.primary.soft{ background:rgba(255,255,255,.1); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
.alarm-btn{ display:flex; align-items:center; justify-content:center; gap:8px; margin:12px auto 0; padding:10px 16px; border-radius:999px; font-size:13.5px; color:var(--ink); background:var(--glass2); border:1px solid var(--line); max-width:100%; }
.alarm-btn svg{ width:16px; height:16px; flex:0 0 16px; color:var(--acc); }
.alarm-btn.todo{ border-color:color-mix(in srgb, var(--acc) 55%, transparent); box-shadow:0 0 18px -6px var(--acc); }
.alarm-btn.done{ color:var(--ink2); }
.link{ display:block; margin:12px auto 0; font-size:13px; color:var(--ink3); text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--ink4); padding:6px 10px; }

.stage-card{ margin-top:22px; position:relative; overflow:hidden; }
.stage-card::before{ content:''; position:absolute; right:-60px; top:-60px; width:180px; height:180px; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--acc) 35%, transparent), transparent); pointer-events:none; }
.sc-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.sc-title{ font-family:var(--serif); font-weight:700; font-size:22px; margin:8px 0 2px; }
.sc-range{ font-size:12px; color:var(--ink3); white-space:nowrap; }
.sc-body{ font-size:14.5px; line-height:1.72; color:var(--ink2); margin:10px 0 0; word-break:keep-all; }
.tip{ display:flex; gap:10px; align-items:flex-start; margin-top:14px; padding:12px 14px; border-radius:16px; background:rgba(255,255,255,.06); font-size:13.5px; line-height:1.6; color:var(--ink); word-break:keep-all; }
.tip svg{ width:18px; height:18px; flex:0 0 18px; margin-top:2px; color:var(--acc); }
.next{ margin-top:16px; }
.next-row{ display:flex; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--ink2); }
.next-row b{ color:var(--ink); font-weight:600; }
.bar{ height:5px; border-radius:99px; background:rgba(255,255,255,.08); margin-top:8px; overflow:hidden; }
.bar > i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--acc),var(--acc2)); transition:width 1s linear; }
.more{ display:flex; align-items:center; gap:6px; margin-top:14px; font-size:13px; color:var(--ink2); }
.more svg{ width:14px; height:14px; }
.poem{ text-align:center; font-family:var(--serif); font-size:15px; color:var(--ink2); margin:26px 8px 4px; line-height:1.7; word-break:keep-all; }

/* ── 몸의 변화 ───────────────────── */
.page-h{ font-family:var(--serif); font-weight:700; font-size:24px; margin:14px 0 4px; }
.page-sub{ font-size:13.5px; color:var(--ink2); line-height:1.65; margin:0 0 18px; word-break:keep-all; }
.tl{ position:relative; padding-left:30px; }
.tl::before{ content:''; position:absolute; left:10px; top:8px; bottom:8px; width:2px; border-radius:2px; background:linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.06)); }
.tl-fill{ position:absolute; left:10px; top:8px; width:2px; border-radius:2px; background:linear-gradient(180deg,var(--acc),var(--acc2)); box-shadow:0 0 10px var(--acc); }
.tl-item{ position:relative; margin-bottom:14px; }
.tl-node{ position:absolute; left:-26px; top:20px; width:14px; height:14px; border-radius:50%; background:#2a2350; border:2px solid rgba(255,255,255,.3); }
.tl-item.past .tl-node{ background:var(--acc); border-color:var(--acc); }
.tl-item.now .tl-node{ background:#fff; border-color:#fff; box-shadow:0 0 0 5px color-mix(in srgb, var(--acc) 35%, transparent), 0 0 18px var(--acc); }
.tl-item .card{ padding:16px; }
.tl-item.future .card{ background:rgba(16,12,38,.22); }
.tl-item.future .tl-t, .tl-item.future .tl-b{ opacity:.78; }
.tl-h{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.tl-hr{ font-family:var(--serif); font-weight:700; font-size:13px; padding:3px 9px; border-radius:999px; background:rgba(255,255,255,.09); }
.tl-now{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; color:#1b1434; background:linear-gradient(135deg,var(--acc),var(--acc2)); }
.tl-t{ font-family:var(--serif); font-weight:700; font-size:18px; margin:8px 0 0; }
.tl-b{ font-size:13.5px; line-height:1.7; color:var(--ink2); margin:6px 0 0; word-break:keep-all; }
.tl-item .tip{ margin-top:10px; font-size:13px; }
.caution{ border-color:rgba(255,190,170,.25); }
.caution h3{ font-family:var(--serif); font-size:16px; margin:0 0 8px; }
.caution ul{ margin:0; padding-left:18px; font-size:13px; line-height:1.75; color:var(--ink2); }
.src{ font-size:11.5px; color:var(--ink3); line-height:1.6; margin-top:12px; }
.src a{ color:var(--ink2); }

/* ── 기록 ───────────────────────── */
.stats{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
.stat{ padding:14px; border-radius:20px; background:var(--glass); border:1px solid var(--line); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); min-width:0; }
.stat .k{ font-size:11.5px; color:var(--ink3); }
.stat .v{ font-family:var(--serif); font-weight:700; font-size:24px; margin-top:4px; white-space:nowrap; }
.stat .v small{ font-family:var(--sans); font-weight:400; font-size:12px; color:var(--ink2); margin-left:3px; }
.sec-h{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
.sec-h h3{ font-family:var(--serif); font-size:17px; margin:0; }
.mnav{ display:flex; align-items:center; gap:4px; }
.mnav button{ width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:var(--glass2); }
.mnav svg{ width:14px; height:14px; }
.mnav span{ font-size:13.5px; min-width:76px; text-align:center; }
.cal{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:5px; }
.cal .dow{ font-size:10.5px; color:var(--ink3); text-align:center; padding-bottom:2px; }
.cal .d{ position:relative; aspect-ratio:1; min-width:0; border-radius:10px; display:grid; place-items:center; font-size:11.5px; color:var(--ink2); background:rgba(255,255,255,.04); }
.cal .d.lv1{ background:color-mix(in srgb, var(--acc) 18%, transparent); }
.cal .d.lv2{ background:color-mix(in srgb, var(--acc) 36%, transparent); color:var(--ink); }
.cal .d.lv3{ background:color-mix(in srgb, var(--acc) 58%, transparent); color:#fff; }
.cal .d.lv4{ background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#1b1434; font-weight:700; }
.cal .d.today{ box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75); }
.cal .d.sel{ outline:2px solid #fff; outline-offset:1px; }
.cal .d.ach::after{ content:''; position:absolute; top:4px; right:4px; width:4px; height:4px; border-radius:50%; background:#fff; }
.cal .d.lv4.ach::after{ background:#1b1434; }
.cal .d.out{ visibility:hidden; }
.legend{ display:flex; align-items:center; gap:5px; justify-content:flex-end; margin-top:10px; font-size:10.5px; color:var(--ink3); }
.legend i{ width:11px; height:11px; border-radius:3px; display:inline-block; }

.rec{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px 4px; border-bottom:1px solid var(--line); }
.rec:last-child{ border-bottom:0; }
.rec-ic{ width:40px; height:40px; flex:0 0 40px; border-radius:14px; display:grid; place-items:center; font-family:var(--serif); font-weight:700; font-size:13px; background:rgba(255,255,255,.07); }
.rec-ic.ok{ background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#1b1434; }
.rec-m{ flex:1; min-width:0; }
.rec-t{ font-size:14.5px; }
.rec-t b{ font-weight:700; }
.rec-s{ font-size:12px; color:var(--ink3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rec-g{ font-size:11.5px; color:var(--ink3); white-space:nowrap; }
.empty{ text-align:center; padding:22px 8px; font-size:13.5px; color:var(--ink3); line-height:1.7; }

.w-row{ display:flex; gap:8px; }
.w-row input{ flex:1; min-width:0; height:46px; padding:0 14px; border-radius:14px; background:rgba(255,255,255,.07); border:1px solid var(--line); font-size:16px; outline:none; }
.w-row input:focus{ border-color:var(--acc); }
.w-row button{ flex:0 0 auto; height:46px; padding:0 18px; border-radius:14px; font-weight:700; color:#1b1434; background:linear-gradient(135deg,var(--acc),var(--acc2)); }
.w-chart{ width:100%; height:auto; display:block; margin-top:14px; }
.w-sum{ display:flex; justify-content:space-between; gap:8px; margin-top:8px; font-size:12.5px; color:var(--ink2); }
.w-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.w-chip{ display:flex; align-items:center; gap:6px; padding:5px 6px 5px 10px; border-radius:999px; background:rgba(255,255,255,.06); font-size:12px; color:var(--ink2); }
.w-chip button{ width:20px; height:20px; border-radius:50%; display:grid; place-items:center; color:var(--ink3); }

/* ── 아래 메뉴 ───────────────────── */
.nav{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 12px); width:min(calc(100% - 32px), 420px); height:var(--navh);
  display:flex; padding:6px; gap:4px; border-radius:24px; background:rgba(16,12,38,.55); border:1px solid var(--line); -webkit-backdrop-filter:blur(20px) saturate(1.2); backdrop-filter:blur(20px) saturate(1.2); z-index:20; }
.nav button{ flex:1 1 0; min-width:0; border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; color:var(--ink3); transition:background .25s, color .25s; }
.nav button svg{ width:21px; height:21px; }
.nav button.on{ color:var(--ink); background:rgba(255,255,255,.1); }
.nav button.on svg{ color:var(--acc); filter:drop-shadow(0 0 6px var(--acc)); }

/* ── 시트 ───────────────────────── */
.sheet-wrap{ position:fixed; inset:0; z-index:50; background:rgba(8,6,20,.55); opacity:0; pointer-events:none; transition:opacity .3s ease; display:flex; align-items:flex-end; justify-content:center; }
.sheet-wrap.open{ opacity:1; pointer-events:auto; }
.sheet{ width:100%; max-width:480px; max-height:88vh; overflow:auto; padding:10px 18px calc(env(safe-area-inset-bottom) + 22px); border-radius:28px 28px 0 0;
  background:linear-gradient(180deg, color-mix(in srgb, var(--s2) 70%, #120d2c), #120d2c 70%); border:1px solid var(--line); border-bottom:0; transform:translateY(40px); transition:transform .35s cubic-bezier(.2,.8,.2,1); }
.sheet-wrap.open .sheet{ transform:none; }
.grab{ width:40px; height:4px; border-radius:4px; background:rgba(255,255,255,.22); margin:2px auto 14px; }
.sh-t{ font-family:var(--serif); font-weight:700; font-size:21px; margin:0 0 6px; }
.sh-s{ font-size:13.5px; color:var(--ink2); line-height:1.65; margin:0 0 16px; word-break:keep-all; }
.plans{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
.pl{ text-align:left; padding:14px; border-radius:20px; background:rgba(255,255,255,.06); border:1px solid var(--line); min-width:0; }
.pl.on{ border-color:transparent; background:linear-gradient(135deg, color-mix(in srgb,var(--acc) 30%, transparent), color-mix(in srgb,var(--acc2) 22%, transparent)); box-shadow:inset 0 0 0 1.5px var(--acc); }
.pl-n{ font-family:var(--serif); font-weight:700; font-size:22px; }
.pl-s{ font-size:12px; color:var(--ink2); margin-top:3px; }
.pl-d{ font-size:11px; color:var(--ink3); margin-top:6px; }
.pl.wide{ grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.step{ display:flex; align-items:center; gap:8px; }
.step button{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.1); font-size:18px; }
.step b{ font-family:var(--serif); font-size:20px; min-width:46px; text-align:center; }
.field{ display:block; margin-bottom:14px; }
.field span{ display:block; font-size:12px; color:var(--ink3); margin-bottom:6px; }
.field input, .field textarea{ width:100%; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.07); border:1px solid var(--line); font-size:16px; outline:none; }
.field textarea{ min-height:84px; resize:vertical; line-height:1.6; }
.field input:focus, .field textarea:focus{ border-color:var(--acc); }
.quick{ display:flex; flex-wrap:wrap; gap:6px; margin:-4px 0 14px; }
.quick button{ padding:7px 12px; border-radius:999px; background:rgba(255,255,255,.07); font-size:12.5px; color:var(--ink2); }
.moods{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-bottom:14px; }
.mood{ display:flex; align-items:center; gap:8px; padding:11px 12px; border-radius:16px; background:rgba(255,255,255,.06); border:1px solid var(--line); font-size:13.5px; text-align:left; min-width:0; }
.mood i{ width:10px; height:10px; border-radius:50%; flex:0 0 10px; }
.mood.on{ border-color:var(--acc); background:color-mix(in srgb, var(--acc) 18%, transparent); }
.big-dur{ text-align:center; margin:6px 0 4px; }
.big-dur .v{ font-weight:200; font-size:44px; font-variant-numeric:tabular-nums; }
.big-dur .s{ font-size:13px; color:var(--ink2); margin-top:2px; }
.row-btns{ display:flex; gap:8px; margin-top:6px; }
.row-btns .primary{ margin-top:0; flex:1 1 0; min-width:0; height:52px; font-size:15.5px; }
.danger{ color:#ffb3b3; }
.set-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 2px; border-bottom:1px solid var(--line); width:100%; text-align:left; }
.set-row:last-child{ border-bottom:0; }
.set-row .k{ font-size:14.5px; }
.set-row .d{ font-size:12px; color:var(--ink3); margin-top:2px; line-height:1.5; }
.set-row .v{ font-size:13px; color:var(--ink2); white-space:nowrap; }
.sw{ width:46px; height:28px; flex:0 0 46px; border-radius:99px; background:rgba(255,255,255,.14); position:relative; transition:background .25s; }
.sw::after{ content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform .25s; }
.sw.on{ background:linear-gradient(135deg,var(--acc),var(--acc2)); }
.sw.on::after{ transform:translateX(18px); }
.toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + var(--navh) + 26px); transform:translate(-50%, 12px); max-width:calc(100% - 40px); padding:11px 18px; border-radius:999px;
  background:rgba(255,255,255,.94); color:#1b1434; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .3s, transform .3s; z-index:60; text-align:center; word-break:keep-all; }
.toast.show{ opacity:1; transform:translate(-50%, 0); }

@media (max-width:340px){
  .app{ padding-left:12px; padding-right:12px; }
  .times{ flex-direction:column; gap:8px; }
  .stats{ gap:8px; }
  .stat .v{ font-size:20px; }
  .plans, .moods{ grid-template-columns:minmax(0,1fr); }
  .nav button span{ font-size:10px; }
  .card{ padding:15px; }
}
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>

<div class="sheet-wrap" id="sheetWrap"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ─────────────────────────────────────────────
   비움 — 간헐적 단식
   기록은 이 기기의 브라우저(localStorage)에만 저장돼요.
   ───────────────────────────────────────────── */
const KEY = 'bium_v1';
const H = 36e5, MIN = 6e4, DAY = 864e5;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 단식 단계 — 공개된 일반 자료를 바탕으로 한 평균적인 기준 (개인차 큼) */
const STAGES = [
  { h:0,  name:'소화의 시간',     short:'소화 중',
    body:'마지막 식사를 소화하는 중이에요. 혈당과 인슐린이 올라가 있고, 몸은 방금 들어온 영양분을 쓰고 남는 건 저장해 둬요.',
    tip:'물이나 따뜻한 차를 곁에 두세요. 오늘의 비움이 시작됐어요.',
    poem:'충분히 먹었으니, 이제 천천히 쉬어가요.',
    sky:['#2a1f4a','#7a3e6e','#f0936b'], acc:['#ffb38a','#ff8fa3'], stars:.12 },
  { h:4,  name:'혈당이 가라앉아요', short:'혈당 안정',
    body:'소화가 거의 끝나면서 혈당과 인슐린이 서서히 내려가요. 몸은 간에 저장해 둔 글리코겐을 꺼내 에너지로 쓰기 시작해요.',
    tip:'이때 오는 배고픔은 대개 습관이에요. 물 한 잔 마시고 10분만 기다려 보세요.',
    poem:'배고픔은 파도처럼 왔다가, 조용히 지나가요.',
    sky:['#231c48','#5b3a78','#c96f8a'], acc:['#f6a6c8','#c9a2ff'], stars:.3 },
  { h:8,  name:'저장고를 여는 시간', short:'글리코겐 사용',
    body:'간의 글리코겐이 점점 줄어들어요. 몸은 지방을 에너지로 쓸 준비를 하며, 지방 분해를 조금씩 늘려 가요.',
    tip:'보통 잠든 사이에 지나가는 구간이에요. 푹 자는 것이 가장 쉬운 단식이에요.',
    poem:'몸이 조용히, 아껴 둔 저장고의 문을 열어요.',
    sky:['#1b1840','#3b3270','#8a5f9e'], acc:['#c6a8ff','#9fb4ff'], stars:.55 },
  { h:12, name:'지방 연소 시작',    short:'지방 연소',
    body:'글리코겐이 많이 줄면서 지방에서 에너지를 얻는 비율이 높아져요. 간에서 케톤이 조금씩 만들어지기 시작하는데, 흔히 ‘미니 케토시스’라고 불러요.',
    tip:'가벼운 산책이나 스트레칭이 잘 어울리는 시간이에요.',
    poem:'밤이 깊어질수록, 몸은 조금씩 가벼워져요.',
    sky:['#121236','#272a62','#4d4a8c'], acc:['#a8b8ff','#8fd3ff'], stars:.8 },
  { h:16, name:'케토시스 진입',     short:'케토시스',
    body:'케톤이 눈에 띄게 늘기 시작하는 무렵이에요. 세포가 낡은 부품을 분해해 다시 쓰는 ‘자가포식(오토파지)’도 서서히 활발해진다고 알려져 있어요.',
    tip:'머리가 맑아지는 사람도, 허기가 몰려오는 사람도 있어요. 둘 다 자연스러운 반응이에요.',
    poem:'여기까지 온 당신, 정말 잘하고 있어요.',
    sky:['#0c1030','#1a2a5a','#2f6f8a'], acc:['#8fe3ff','#8ff0d0'], stars:1 },
  { h:18, name:'케토시스 본격',     short:'깊어지는 케토시스',
    body:'지방과 케톤이 주된 에너지원이 되어 가요. 인슐린은 낮게 유지되고, 몸은 지방을 중심으로 움직여요.',
    tip:'물과 함께 소금 한 꼬집 같은 전해질을 챙겨 주세요.',
    poem:'고요한 밤, 몸은 스스로를 돌보는 중이에요.',
    sky:['#0a0e28','#123450','#2a8a86'], acc:['#8ff0c8','#c2f59a'], stars:1 },
  { h:24, name:'자가포식 활발',     short:'자가포식',
    body:'간의 글리코겐이 거의 바닥나요. 자가포식이 더 활발해진다고 여겨지지만, 사람에게서 정확히 언제부터인지는 아직 연구 중이에요.',
    tip:'어지럽거나 가슴이 두근거리면 바로 멈추고, 부드러운 음식부터 천천히 드세요.',
    poem:'하루를 꼬박 비워낸 당신에게, 조용한 박수를.',
    sky:['#140f33','#3c2a66','#b06a9a'], acc:['#ffb3d1','#d6b0ff'], stars:.7 },
  { h:36, name:'깊은 케토시스',     short:'깊은 비움',
    body:'케톤 수치가 더 높아지고, 몸은 지방 대사에 깊이 들어가요. 피로감이나 추위를 평소보다 쉽게 느낄 수 있어요.',
    tip:'36시간 이상은 경험자에게도 부담이 될 수 있어요. 몸 상태를 자주 살펴 주세요.',
    poem:'무리하지 않는 것도, 용기예요.',
    sky:['#1a1438','#5a3570','#e08a8a'], acc:['#ffc0a8','#ffa3b8'], stars:.45 },
  { h:48, name:'장기 단식',         short:'장기 단식',
    body:'의학적으로 장기 단식에 들어서는 구간이에요. 몸은 에너지를 아끼는 모드로 바뀌고, 근육을 지키려 애써요.',
    tip:'48시간 이상은 꼭 의사와 상의한 뒤에 해 주세요.',
    poem:'이제는 몸의 목소리에, 더 귀 기울여요.',
    sky:['#1e1a40','#6a4478','#f2b07a'], acc:['#ffd79a','#ffb38a'], stars:.25 }
];
const THEME_EAT  = { sky:['#33285a','#a25d82','#ffc995'], acc:['#ffd59e','#ffb38a'], stars:.04 };
const THEME_IDLE = { sky:['#1d1940','#3e3470','#7d6aa8'], acc:['#cbbcff','#ffc2dc'], stars:.5 };

const PLANS = [
  { id:'12:12', f:12, e:12, sub:'처음 시작하는 분께' },
  { id:'14:10', f:14, e:10, sub:'부드러운 입문' },
  { id:'16:8',  f:16, e:8,  sub:'가장 많이 하는 방식' },
  { id:'18:6',  f:18, e:6,  sub:'조금 더 깊게' },
  { id:'20:4',  f:20, e:4,  sub:'짧고 굵은 식사' },
  { id:'23:1',  f:23, e:1,  sub:'하루 한 끼 (OMAD)' },
];
const MOODS = [
  ['light','가벼웠어요','#9ff0d0'], ['ok','괜찮았어요','#a8c8ff'],
  ['hard','조금 힘들었어요','#ffc79e'], ['tough','많이 힘들었어요','#ff9fae']
];
const moodOf = id => MOODS.find(m => m[0] === id);

/* ── 저장 ─────────────────────────── */
function fresh(){ return { v:1, planId:'16:8', customF:24, cur:null, lastEnd:null, fasts:[], weights:[], notify:false, chime:true, ack:false }; }
function normalize(d){
  const s = Object.assign(fresh(), d && typeof d === 'object' ? d : {});
  s.fasts = Array.isArray(s.fasts) ? s.fasts.filter(f => f && f.id && +f.start && +f.end && f.end > f.start) : [];
  s.weights = Array.isArray(s.weights) ? s.weights.filter(w => w && /^\d{4}-\d\d-\d\d$/.test(w.d) && +w.kg > 0) : [];
  if (s.cur && !(+s.cur.start > 0)) s.cur = null;
  if (s.cur && !(+s.cur.goal > 0)) s.cur.goal = 16;
  s.customF = Math.min(72, Math.max(10, +s.customF || 24));
  return s;
}
function load(){ try { const t = localStorage.getItem(KEY); return t ? normalize(JSON.parse(t)) : fresh(); } catch(e){ return fresh(); } }
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('저장 공간에 기록하지 못했어요'); } }

function plan(){
  if (S.planId === 'custom') { const f = S.customF; return { id:'custom', f, e: f < 24 ? 24 - f : 0, sub:'나만의 단식' }; }
  return PLANS.find(p => p.id === S.planId) || PLANS[2];
}
const planName = p => p.id === 'custom' ? `${p.f}시간` : (p.id === '23:1' ? 'OMAD' : p.id);

/* ── 시간 도우미 ───────────────────── */
const pad = n => String(n).padStart(2, '0');
const dkey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
function hms(ms){ ms = Math.max(0, ms); const s = Math.floor(ms/1000); return `${Math.floor(s/3600)}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`; }
function dur(ms, short){
  ms = Math.max(0, ms); const m = Math.floor(ms/MIN); const h = Math.floor(m/60), r = m % 60;
  if (h === 0) return `${r}분`;
  if (r === 0 || short) return `${h}시간`;
  return `${h}시간 ${r}분`;
}
const clock = ts => new Date(ts).toLocaleTimeString('ko-KR', { hour:'numeric', minute:'2-digit' });
function dayWord(ts){
  const k = dkey(ts), now = Date.now();
  if (k === dkey(now)) return '오늘';
  if (k === dkey(now - DAY)) return '어제';
  if (k === dkey(now + DAY)) return '내일';
  const d = new Date(ts); return `${d.getMonth()+1}월 ${d.getDate()}일`;
}
const when = ts => `${dayWord(ts)} ${clock(ts)}`;
function toLocalInput(ts){ const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fromLocalInput(v){ const t = new Date(v).getTime(); return isNaN(t) ? null : t; }
const stageIdx = hrs => { let i = 0; STAGES.forEach((s, k) => { if (hrs >= s.h) i = k; }); return i; };
const rangeOf = i => STAGES[i+1] ? `${STAGES[i].h}–${STAGES[i+1].h}시간` : `${STAGES[i].h}시간 이상`;

/* ── 현재 상태 ─────────────────────── */
function phase(now){
  if (S.cur) {
    const el = now - S.cur.start, hrs = el / H, goalMs = S.cur.goal * H;
    return { p:'fast', el, hrs, i: stageIdx(hrs), goalMs, ach: el >= goalMs };
  }
  const pl = plan();
  if (S.lastEnd && pl.e > 0 && now - S.lastEnd < pl.e * H && now >= S.lastEnd) return { p:'eat', el: now - S.lastEnd, win: pl.e * H };
  return { p:'idle' };
}

/* ── 하늘 테마 ─────────────────────── */
function applyTheme(t){
  const st = document.documentElement.style;
  st.setProperty('--s1', t.sky[0]); st.setProperty('--s2', t.sky[1]); st.setProperty('--s3', t.sky[2]);
  st.setProperty('--acc', t.acc[0]); st.setProperty('--acc2', t.acc[1]);
  $('#stars').style.opacity = t.stars;
  $('#metaTheme').setAttribute('content', t.sky[0]);
}
function makeStars(){
  let h = '';
  for (let k = 0; k < 70; k++) {
    const sz = (Math.random() * 1.6 + .8).toFixed(1);
    h += `<i style="left:${(Math.random()*100).toFixed(2)}%;top:${(Math.random()*100).toFixed(2)}%;width:${sz}px;height:${sz}px;--d:${(3+Math.random()*5).toFixed(1)}s;--dl:${(-Math.random()*6).toFixed(1)}s"></i>`;
  }
  $('#stars').innerHTML = h;
}

/* ── 아이콘 ─────────────────────────── */
const IC = {
  leaf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 15-14-1 10-6 15-14 15"/><path d="M5 19c3-4 6-6.5 9-8"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  x:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

/* ── 오늘 화면 ─────────────────────── */
const R = 118, C = 2 * Math.PI * R;
let sig = '';
function polar(frac, r){ const a = frac * 2 * Math.PI - Math.PI/2; return [150 + r * Math.cos(a), 150 + r * Math.sin(a)]; }

function renderToday(){
  const now = Date.now(), ph = phase(now), pl = plan();
  const chip = $('#planChip');
  chip.innerHTML = `<i class="dot"></i><span>단식 계획</span><b>${esc(planName(pl))}</b>${IC.down}`;

  const marks = $('#marks'); marks.innerHTML = '';
  const ringBox = $('#ringBox'); ringBox.classList.toggle('ach', ph.p === 'fast' && ph.ach);
  $('#prog').setAttribute('stroke-dasharray', C.toFixed(2));

  if (ph.p === 'fast') {
    const goal = S.cur.goal;
    let m = '';
    STAGES.forEach(s => {
      if (s.h <= 0 || s.h >= goal) return;
      const [x, y] = polar(s.h / goal, R), [lx, ly] = polar(s.h / goal, R + 22);
      const on = ph.hrs >= s.h ? ' on' : '';
      m += `<circle class="mk${on}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5"/><text class="mkl${on}" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}">${s.h}</text>`;
    });
    const [gx, gy] = polar(0, R + 22);
    m += `<text class="mkl${ph.ach ? ' on' : ''}" x="${gx}" y="${gy.toFixed(1)}">${goal}h</text>`;
    marks.innerHTML = m;
    applyTheme(STAGES[ph.i]);
    $('#rcLabel').textContent = `단식 중 · ${planName(pl)}`;
    $('#rcStage').hidden = false; $('#rcStage').textContent = STAGES[ph.i].short;
    $('#times').innerHTML = `
      <div><div class="t-k">시작</div><button class="t-v t-edit" id="editStart" style="width:100%"><span>${esc(when(S.cur.start))}</span>${IC.edit}</button></div>
      <div><div class="t-k">목표 · ${goal}시간</div><div class="t-v">${esc(when(S.cur.start + goal * H))}</div></div>`;
    $('#editStart').onclick = editStartSheet;
    const btn = $('#mainBtn'); btn.textContent = '단식 마치기'; btn.classList.toggle('soft', !ph.ach);
    $('#subBtn').textContent = '목표 시간 바꾸기'; $('#subBtn').onclick = planSheet;
    const endAt = S.cur.start + goal * H, ab = $('#alarmBtn');
    ab.hidden = ph.ach;
    const added = S.cur.cal === endAt;
    ab.className = 'alarm-btn ' + (added ? 'done' : 'todo');
    ab.innerHTML = added ? `${IC.check}<span>캘린더 알람 넣음 · ${esc(clock(endAt))}</span>` : `${IC.bell}<span>끝나는 시각에 알람 맞추기</span>`;
    ab.onclick = alarmSheet;
    renderStageCard(ph);
    $('#poem').textContent = ph.ach ? '목표에 닿았어요. 오늘의 당신, 참 단단해요.' : STAGES[ph.i].poem;
  } else if (ph.p === 'eat') {
    $('#alarmBtn').hidden = true;
    applyTheme(THEME_EAT);
    $('#rcLabel').textContent = '먹는 시간';
    $('#rcStage').hidden = true;
    const nextStart = S.lastEnd + ph.win;
    $('#times').innerHTML = `
      <div><div class="t-k">단식 마침</div><div class="t-v">${esc(when(S.lastEnd))}</div></div>
      <div><div class="t-k">다음 단식 권장</div><div class="t-v">${esc(when(nextStart))}</div></div>`;
    const btn = $('#mainBtn'); btn.textContent = '단식 시작'; btn.classList.remove('soft');
    $('#subBtn').textContent = '이미 시작했어요 · 시작 시간 고르기'; $('#subBtn').onclick = () => pickStartSheet();
    const last = S.fasts[S.fasts.length - 1];
    $('#stageCard').innerHTML = `
      <div class="eyebrow">먹는 시간</div>
      <div class="sc-title">잘 먹는 것도 단식의 일부예요</div>
      <p class="sc-body">단식을 마친 뒤 첫 식사는 부드럽고 따뜻한 것부터 천천히 시작해 보세요. 단백질과 채소를 넉넉히, 물도 충분히 마셔 주세요.</p>
      ${last ? `<div class="tip">${IC.leaf}<div>지난 단식 <b>${esc(dur(last.end - last.start))}</b> · ${esc(STAGES[stageIdx((last.end-last.start)/H)].name)}까지 닿았어요.</div></div>` : ''}`;
    $('#poem').textContent = '채우는 시간도, 비우는 시간만큼 소중해요.';
  } else {
    $('#alarmBtn').hidden = true;
    applyTheme(THEME_IDLE);
    $('#rcLabel').textContent = '준비됐어요';
    $('#rcStage').hidden = true;
    const last = S.fasts[S.fasts.length - 1];
    $('#times').innerHTML = `
      <div><div class="t-k">오늘의 계획</div><div class="t-v">${pl.f}시간 비우기${pl.e ? ` · ${pl.e}시간 먹기` : ''}</div></div>
      <div><div class="t-k">지난 단식</div><div class="t-v">${last ? esc(dur(last.end - last.start)) + ' · ' + esc(dayWord(last.end)) : '아직 없어요'}</div></div>`;
    const btn = $('#mainBtn'); btn.textContent = '단식 시작'; btn.classList.remove('soft');
    $('#subBtn').textContent = '이미 시작했어요 · 시작 시간 고르기'; $('#subBtn').onclick = () => pickStartSheet();
    $('#stageCard').innerHTML = `
      <div class="eyebrow">비움에 오신 걸 환영해요</div>
      <div class="sc-title">단식하는 동안, 몸은 이렇게 달라져요</div>
      <p class="sc-body">단식을 시작하면 시간이 흐를수록 몸 안에서 일어나는 변화를 단계별로 알려 드릴게요. 하늘의 색도 함께 바뀌어요.</p>
      <div class="tip">${IC.leaf}<div>${STAGES.slice(3,7).map(s => `<b>${s.h}시간</b> ${esc(s.short)}`).join(' · ')}</div></div>
      <button class="more" data-go="stages">모든 단계 보기 ${IC.right}</button>`;
    $('#poem').textContent = '준비가 되면, 가볍게 시작해 볼까요.';
  }
  bindGo($('#stageCard'));
  sig = sigOf(ph);
  tickToday(now, ph);
}

function renderStageCard(ph){
  const s = STAGES[ph.i], nx = STAGES[ph.i + 1];
  let next = '';
  if (nx) {
    const span = (nx.h - s.h) * H, done = ph.el - s.h * H;
    next = `<div class="next"><div class="next-row"><span>다음 · <b>${esc(nx.name)}</b></span><span id="nextLeft">${esc(dur(nx.h * H - ph.el))} 남음</span></div>
      <div class="bar"><i id="nextBar" style="width:${Math.min(100, done / span * 100).toFixed(1)}%"></i></div></div>`;
  }
  $('#stageCard').innerHTML = `
    <div class="sc-top"><div class="eyebrow">지금 몸은</div><div class="sc-range">${esc(rangeOf(ph.i))}</div></div>
    <div class="sc-title">${esc(s.name)}</div>
    <p class="sc-body">${esc(s.body)}</p>
    <div class="tip">${IC.leaf}<div>${esc(s.tip)}</div></div>
    ${next}
    <button class="more" data-go="stages">모든 단계 보기 ${IC.right}</button>`;
}

const sigOf = ph => ph.p === 'fast' ? `f${ph.i}${ph.ach ? 'a' : ''}${S.cur.goal}${S.cur.start}` : ph.p + (S.lastEnd || '') + S.planId + S.customF;

function tickToday(now, ph){
  let frac = 0;
  if (ph.p === 'fast') {
    frac = Math.min(1, ph.el / ph.goalMs);
    $('#rcTime').textContent = hms(ph.el);
    $('#rcSub').innerHTML = ph.ach
      ? `<b>목표 달성 ✦</b> +${esc(dur(ph.el - ph.goalMs))}`
      : `목표까지 <b>${esc(dur(ph.goalMs - ph.el))}</b>`;
    const nx = STAGES[ph.i + 1];
    if (nx && $('#nextLeft')) {
      const s = STAGES[ph.i];
      $('#nextLeft').textContent = `${dur(nx.h * H - ph.el)} 남음`;
      $('#nextBar').style.width = Math.min(100, (ph.el - s.h * H) / ((nx.h - s.h) * H) * 100).toFixed(1) + '%';
    }
  } else if (ph.p === 'eat') {
    frac = Math.min(1, ph.el / ph.win);
    $('#rcTime').textContent = hms(ph.win - ph.el);
    $('#rcSub').innerHTML = `다음 단식까지 남은 시간`;
  } else {
    const pl = plan();
    $('#rcTime').textContent = `${pl.f}:00:00`;
    $('#rcSub').innerHTML = `버튼을 누르면 <b>${pl.f}시간</b> 비움이 시작돼요`;
  }
  $('#prog').setAttribute('stroke-dashoffset', (C * (1 - frac)).toFixed(2));
  $('#prog').style.opacity = frac > 0 ? 1 : 0;
  const [ox, oy] = polar(frac, R);
  const orb = $('#orb'); orb.setAttribute('cx', ox.toFixed(2)); orb.setAttribute('cy', oy.toFixed(2));
  orb.style.opacity = ph.p === 'idle' ? .35 : 1;
}

/* ── 몸의 변화 화면 ────────────────── */
function renderStages(){
  const ph = phase(Date.now()), fasting = ph.p === 'fast';
  let items = '';
  STAGES.forEach((s, k) => {
    const cls = !fasting ? 'future' : (k < ph.i ? 'past' : k === ph.i ? 'now' : 'future');
    items += `<div class="tl-item ${cls}" ${cls === 'now' ? 'id="tlNow"' : ''}>
      <div class="tl-node"></div>
      <div class="card">
        <div class="tl-h"><span class="tl-hr">${esc(rangeOf(k))}</span>${cls === 'now' ? `<span class="tl-now">지금 여기 · ${esc(dur(ph.el))}째</span>` : ''}</div>
        <div class="tl-t">${esc(s.name)}</div>
        <p class="tl-b">${esc(s.body)}</p>
        <div class="tip">${IC.leaf}<div>${esc(s.tip)}</div></div>
      </div></div>`;
  });
  $('#v-stages').innerHTML = `
    <h2 class="page-h">몸의 변화</h2>
    <p class="page-sub">단식 시간이 흐르며 몸 안에서 일어나는 일들이에요. 시간은 평균적인 기준이라, 마지막 식사의 종류와 활동량, 체질에 따라 몇 시간씩 앞당겨지거나 늦어질 수 있어요.</p>
    <div class="tl" id="tl"><div class="tl-fill" id="tlFill"></div>${items}</div>
    <div class="card caution" style="margin-top:6px">
      <h3>이런 분은 먼저 의사와 상의해 주세요</h3>
      <ul>
        <li>임신 중이거나 수유 중인 분</li>
        <li>당뇨약·인슐린·혈압약 등을 복용 중인 분</li>
        <li>섭식장애를 겪었거나 저체중인 분</li>
        <li>성장기 청소년, 만성질환이 있는 분</li>
      </ul>
      <p class="src">이 내용은 일반적인 건강 정보이며 의학적 진단이나 처방을 대신하지 않아요. 참고: <a href="https://www.healthline.com/nutrition/stages-of-fasting" target="_blank" rel="noopener">Healthline</a>, <a href="https://www.mindbodygreen.com/articles/stages-of-fasting" target="_blank" rel="noopener">mindbodygreen</a> 등 공개 자료.</p>
    </div>`;
  requestAnimationFrame(() => {
    const now = $('#tlNow'), tl = $('#tl'), fill = $('#tlFill');
    if (now && tl) {
      fill.style.height = Math.max(0, now.offsetTop + 27 - 8) + 'px';
      now.scrollIntoView({ block:'center', behavior:'smooth' });
    } else fill.style.height = '0px';
  });
}

/* ── 기록 화면 ─────────────────────── */
let calY, calM, selDay = null, showAll = false;
const latestEnd = () => S.fasts.length ? S.fasts.reduce((a, x) => Math.max(a, x.end), 0) : null;
function achieved(f){ return f.end - f.start >= (f.goal || 0) * H - 1000; }
function streak(){
  const set = new Set(S.fasts.filter(achieved).map(f => dkey(f.end)));
  let t = Date.now(); if (!set.has(dkey(t))) t -= DAY;
  let n = 0; while (set.has(dkey(t))) { n++; t -= DAY; }
  return n;
}
function renderLog(){
  const now = new Date();
  if (calY == null) { calY = now.getFullYear(); calM = now.getMonth(); }
  const fs = S.fasts.slice().sort((a, b) => b.end - a.end);
  const thisMonth = fs.filter(f => { const d = new Date(f.end); return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); }).length;
  const recent = fs.slice(0, 30);
  const avg = recent.length ? recent.reduce((a, f) => a + (f.end - f.start), 0) / recent.length / H : 0;
  const longest = fs.reduce((a, f) => Math.max(a, f.end - f.start), 0);

  // 달력
  const byDay = {};
  S.fasts.forEach(f => { const k = dkey(f.end); (byDay[k] = byDay[k] || { ms:0, ach:false, list:[] }); byDay[k].ms += f.end - f.start; byDay[k].ach = byDay[k].ach || achieved(f); byDay[k].list.push(f); });
  const first = new Date(calY, calM, 1), days = new Date(calY, calM + 1, 0).getDate(), lead = first.getDay();
  let cal = ['일','월','화','수','목','금','토'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let k = 0; k < lead; k++) cal += `<div class="d out"></div>`;
  const tk = dkey(Date.now());
  for (let d = 1; d <= days; d++) {
    const k = `${calY}-${pad(calM+1)}-${pad(d)}`, info = byDay[k];
    const h = info ? info.ms / H : 0;
    const lv = !info ? 0 : h < 12 ? 1 : h < 16 ? 2 : h < 20 ? 3 : 4;
    cal += `<button class="d lv${lv}${info && info.ach ? ' ach' : ''}${k === tk ? ' today' : ''}${k === selDay ? ' sel' : ''}" data-day="${k}" aria-label="${calM+1}월 ${d}일">${d}</button>`;
  }
  let dayList = '';
  if (selDay) {
    const info = byDay[selDay]; const [, mm, dd] = selDay.split('-');
    dayList = `<div style="margin-top:14px"><div class="eyebrow" style="margin-bottom:4px">${+mm}월 ${+dd}일</div>${info ? info.list.sort((a,b)=>a.start-b.start).map(recHtml).join('') : '<div class="empty" style="padding:10px">이날은 기록이 없어요</div>'}</div>`;
  }

  const listItems = (showAll ? fs : fs.slice(0, 8)).map(recHtml).join('');
  $('#v-log').innerHTML = `
    <h2 class="page-h">기록</h2>
    <p class="page-sub">비워낸 시간들이 차곡차곡 쌓이고 있어요.</p>
    <div class="stats">
      <div class="stat"><div class="k">연속 달성</div><div class="v">${streak()}<small>일</small></div></div>
      <div class="stat"><div class="k">이번 달 단식</div><div class="v">${thisMonth}<small>회</small></div></div>
      <div class="stat"><div class="k">평균 단식</div><div class="v">${avg ? avg.toFixed(1) : '–'}<small>${avg ? '시간' : ''}</small></div></div>
      <div class="stat"><div class="k">가장 긴 단식</div><div class="v">${longest ? (longest / H).toFixed(1) : '–'}<small>${longest ? '시간' : ''}</small></div></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="sec-h"><h3>비움 달력</h3>
        <div class="mnav"><button id="mPrev" aria-label="이전 달">${IC.left}</button><span>${calY}년 ${calM+1}월</span><button id="mNext" aria-label="다음 달">${IC.right}</button></div></div>
      <div class="cal">${cal}</div>
      <div class="legend">짧게 <i style="background:color-mix(in srgb,var(--acc) 18%,transparent)"></i><i style="background:color-mix(in srgb,var(--acc) 36%,transparent)"></i><i style="background:color-mix(in srgb,var(--acc) 58%,transparent)"></i><i style="background:linear-gradient(135deg,var(--acc),var(--acc2))"></i> 길게 · 점 = 목표 달성</div>
      ${dayList}
    </div>
    <div class="card">
      <div class="sec-h"><h3>몸무게</h3><span class="muted" style="font-size:12px">선택 기록</span></div>
      <div class="w-row"><input id="wIn" type="number" inputmode="decimal" step="0.1" min="20" max="300" placeholder="오늘 몸무게 (kg)"><button id="wAdd">기록</button></div>
      ${weightChart()}
    </div>
    <div class="card">
      <div class="sec-h"><h3>지난 단식</h3><span class="muted" style="font-size:12px">${fs.length}회</span></div>
      ${fs.length ? listItems : '<div class="empty">아직 기록이 없어요.<br>첫 단식을 마치면 여기에 남아요.</div>'}
      ${fs.length > 8 ? `<button class="link" id="moreRec">${showAll ? '접기' : `전체 ${fs.length}개 보기`}</button>` : ''}
    </div>`;

  $('#mPrev').onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } selDay = null; renderLog(); };
  $('#mNext').onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } selDay = null; renderLog(); };
  document.querySelectorAll('#v-log .d[data-day]').forEach(b => b.onclick = () => { selDay = selDay === b.dataset.day ? null : b.dataset.day; renderLog(); });
  document.querySelectorAll('#v-log [data-rec]').forEach(b => b.onclick = () => editRecSheet(b.dataset.rec));
  document.querySelectorAll('#v-log [data-wdel]').forEach(b => b.onclick = () => { S.weights = S.weights.filter(w => w.d !== b.dataset.wdel); save(); renderLog(); });
  const more = $('#moreRec'); if (more) more.onclick = () => { showAll = !showAll; renderLog(); };
  const wIn = $('#wIn');
  wIn.oninput = () => { try { sessionStorage.setItem('bium_w_draft', wIn.value); } catch(e){} };
  try { const dft = sessionStorage.getItem('bium_w_draft'); if (dft) wIn.value = dft; } catch(e){}
  $('#wAdd').onclick = () => {
    const kg = parseFloat(String(wIn.value).replace(',', '.'));
    if (!(kg > 20 && kg < 300)) { toast('몸무게를 kg 단위로 적어 주세요'); return; }
    const d = dkey(Date.now());
    S.weights = S.weights.filter(w => w.d !== d); S.weights.push({ d, kg: Math.round(kg * 10) / 10 });
    S.weights.sort((a, b) => a.d < b.d ? -1 : 1); save();
    try { sessionStorage.removeItem('bium_w_draft'); } catch(e){}
    toast('오늘의 몸무게를 남겼어요'); renderLog();
  };
}
function recHtml(f){
  const ms = f.end - f.start, ok = achieved(f), md = moodOf(f.mood);
  return `<button class="rec" data-rec="${esc(f.id)}">
    <div class="rec-ic${ok ? ' ok' : ''}">${Math.floor(ms / H)}h</div>
    <div class="rec-m"><div class="rec-t"><b>${esc(dur(ms))}</b> ${md ? `<span class="muted" style="font-size:12px">· ${esc(md[1])}</span>` : ''}</div>
      <div class="rec-s">${esc(when(f.start))} → ${esc(clock(f.end))}${f.note ? ' · ' + esc(f.note) : ''}</div></div>
    <div class="rec-g">${ok ? '달성' : `목표 ${f.goal || '–'}h`}</div></button>`;
}
function weightChart(){
  const ws = S.weights.slice(-30);
  if (!ws.length) return '<div class="empty" style="padding:16px 8px 4px">몸무게를 남기면 흐름을 그려 드릴게요.</div>';
  const W = 300, Hh = 110, pX = 10, pY = 14;
  const vals = ws.map(w => w.kg), mn = Math.min(...vals), mx = Math.max(...vals), span = Math.max(.6, mx - mn);
  const pts = ws.map((w, k) => [pX + (ws.length === 1 ? (W - 2*pX) / 2 : k * (W - 2*pX) / (ws.length - 1)), pY + (1 - (w.kg - mn + (span - (mx - mn)) / 2) / span) * (Hh - 2*pY)]);
  const line = pts.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = `${line} L${pts[pts.length-1][0].toFixed(1)} ${Hh} L${pts[0][0].toFixed(1)} ${Hh} Z`;
  const diff = ws.length > 1 ? Math.round((ws[ws.length-1].kg - ws[0].kg) * 10) / 10 : 0;
  const last = pts[pts.length - 1];
  return `<svg class="w-chart" viewBox="0 0 ${W} ${Hh}" aria-label="몸무게 그래프">
      <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc);stop-opacity:.38"/><stop offset="1" style="stop-color:var(--acc);stop-opacity:0"/></linearGradient></defs>
      <path d="${area}" fill="url(#wg)"/>
      <path d="${line}" fill="none" style="stroke:var(--acc)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="#fff"/>
    </svg>
    <div class="w-sum"><span>최근 <b style="color:var(--ink)">${ws[ws.length-1].kg}kg</b></span><span>${ws.length > 1 ? `${ws.length}번의 기록 동안 ${diff > 0 ? '+' : ''}${diff}kg` : '첫 기록이에요'}</span></div>
    <div class="w-list">${ws.slice(-5).reverse().map(w => `<span class="w-chip">${+w.d.slice(5,7)}/${+w.d.slice(8)} · ${w.kg}kg<button data-wdel="${w.d}" aria-label="삭제">${IC.x}</button></span>`).join('')}</div>`;
}

function startFast(at){
  if (!S.ack) { ackSheet(() => startFast(at)); return; }
  const start = Math.min(at || Date.now(), Date.now());
  S.cur = { start, goal: plan().f }; resetSeen();
  save(); renderAll();
  toast(at ? `${when(start)}부터 단식 중이에요` : '비움을 시작했어요. 천천히, 가볍게.');
  if (S.notify) ensurePermission();
}

function backupText(){ return JSON.stringify({ app:'bium', v:1, at: new Date().toISOString(), data: S }); }
function showText(txt){
  openSheet(`<h3 class="sh-t">백업 글자</h3><p class="sh-s">아래 글자를 길게 눌러 전체 선택 후 복사해 주세요.</p>

function restoreSheet(){
  openSheet(`<h3 class="sh-t">백업 복원</h3><p class="sh-s">복사해 둔 백업 글자를 붙여 넣어 주세요. 지금 기록과 합쳐지고, 같은 기록은 한 번만 남아요.</p>
    <label class="field"><textarea id="rsT" style="min-height:160px;font-size:12px" placeholder='{"app":"bium", ...}'></textarea></label>
    <button class="primary" id="rsOk">복원하기</button>`, () => {
    $('#rsOk').onclick = () => {
      let d; try { d = JSON.parse($('#rsT').value); } catch(e){ toast('백업 글자가 올바르지 않아요'); return; }
      const src = normalize(d && d.data ? d.data : d);
      const map = new Map(S.fasts.map(f => [f.id, f]));
      let added = 0; src.fasts.forEach(f => { if (!map.has(f.id)) { map.set(f.id, f); added++; } });
      S.fasts = [...map.values()].sort((a, b) => a.start - b.start);
      const wm = new Map(S.weights.map(w => [w.d, w])); src.weights.forEach(w => { if (!wm.has(w.d)) wm.set(w.d, w); });
      S.weights = [...wm.values()].sort((a, b) => a.d < b.d ? -1 : 1);
      if (!S.cur && src.cur && Date.now() - src.cur.start < 96 * H) S.cur = src.cur;
      if (src.lastEnd && (!S.lastEnd || src.lastEnd > S.lastEnd)) S.lastEnd = src.lastEnd;
      S.ack = S.ack || src.ack;
      save(); closeSheet(); renderAll(); toast(`단식 기록 ${added}개를 불러왔어요`);
    };
  });
}

const icsTime = ts => new Date(ts).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
// 캘린더 파일 규칙: 한 줄이 75바이트를 넘으면 접어서 이어 써요 (한글이 중간에 잘리지 않게)
function icsFold(line){
  const enc = new TextEncoder(); let out = '', cur = '', n = 0;
  for (const ch of line) {
    const b = enc.encode(ch).length;
    if (n + b > (out ? 74 : 75)) { out += (out ? '\r\n ' : '') + cur; cur = ''; n = 0; }
    cur += ch; n += b;
  }
  return out ? out + '\r\n ' + cur : cur;
}
function alarmSheet(){
  if (!S.cur) return;
  const goal = S.cur.goal, end = S.cur.start + goal * H;
  if (end <= Date.now()) { toast('이미 목표 시간이 지났어요'); return; }
  const title = `비움 · ${goal}시간 단식 목표 달성`;
  const detail = `${goal}시간 단식 목표에 닿았어요. 수고했어요! 비움 앱에서 단식을 마쳐 주세요. https://enjukim.github.io/bium/`;
  openSheet(`
    <h3 class="sh-t">끝나는 시각에 알람 맞추기</h3>
    <p class="sh-s">폰 캘린더에 일정으로 넣어 두면, 비움을 닫아 두어도 캘린더가 소리와 진동으로 알려줘요.</p>
    <div class="big-dur"><div class="v" style="font-size:34px">${esc(when(end))}</div><div class="s">${goal}시간 단식 목표</div></div>
    <button class="primary" id="alIcs" style="margin-top:18px">폰 캘린더에 넣기 (삼성 캘린더 등)</button>
    <p class="sh-s" style="font-size:12.5px;margin:10px 4px 0">파일(.ics)이 내려받아지면 알림창이나 ‘다운로드’에서 눌러 <b>캘린더로 열기 → 저장</b>해 주세요. 정각에 울리는 알림이 함께 들어가요.</p>
    <button class="primary soft" id="alG" style="margin-top:16px">구글 캘린더에 넣기</button>
    <p class="sh-s" style="font-size:12.5px;margin:10px 4px 0">구글 캘린더는 내 캘린더의 기본 알림 설정(보통 10~30분 전)에 맞춰 울려요.</p>
    <div class="tip" style="margin-top:14px">${IC.leaf}<div>목표 시간이나 시작 시각을 바꾸면, 알람도 다시 넣어 주세요.</div></div>`, () => {
    const mark = () => { if (S.cur) { S.cur.cal = end; save(); } closeSheet(); renderAll(); };
    $('#alIcs').onclick = () => {
      const ics = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//bium//fasting//KO', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
        'BEGIN:VEVENT',
        `UID:bium-${S.cur.start}-${goal}@enjukim.github.io`,
        `DTSTAMP:${icsTime(Date.now())}`,
        `DTSTART:${icsTime(end)}`,
        `DTEND:${icsTime(end + 15 * MIN)}`,
        `SUMMARY:${title}`,
        `DESCRIPTION:${detail}`,
        'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${title}`, 'TRIGGER:PT0S', 'END:VALARM',
        'END:VEVENT', 'END:VCALENDAR', ''
      ].map(icsFold).join('\r\n');
      try {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([ics], { type:'text/calendar;charset=utf-8' }));
        a.download = `bium-${dkey(end)}-${pad(new Date(end).getHours())}${pad(new Date(end).getMinutes())}.ics`;
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
        mark(); toast('캘린더 파일을 내려받았어요. 열어서 저장해 주세요');
      } catch(e){ toast('파일을 만들지 못했어요. 구글 캘린더로 넣어 주세요'); }
    };
    $('#alG').onclick = () => {
      const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        + '&text=' + encodeURIComponent(title)
        + '&dates=' + icsTime(end) + '/' + icsTime(end + 15 * MIN)
        + '&details=' + encodeURIComponent(detail);
      window.open(url, '_blank', 'noopener');
      mark();
    };
  });
}

/* ── 차임 소리 (앱이 열려 있을 때) ───── */
let actx = null;
function audio(){
  try {
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; actx = new AC(); }
    if (actx.state === 'suspended') actx.resume().catch(() => {});
    return actx;
  } catch(e){ return null; }
}
// 폰은 화면을 한 번 만진 뒤에야 소리를 낼 수 있어서, 터치할 때마다 소리 장치를 깨워 둬요
document.addEventListener('pointerdown', () => { if (S.chime) audio(); }, { passive:true });
function bell(ctx, t, f, vol, len){
  [[1, 1], [2.01, .3], [3.02, .1], [4.2, .05]].forEach(([m, a]) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f * m;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol * a, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len / Math.pow(m, 0.5));
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + len + 0.1);
  });
}
function chime(kind, force){
  if (!S.chime && !force) return;
  const ctx = audio(); if (!ctx) return;
  const t = ctx.currentTime + 0.05;
  if (kind === 'goal') [659.25, 830.61, 987.77, 1318.51].forEach((f, k) => bell(ctx, t + k * 0.32, f, .2, 3));
  else { bell(ctx, t, 880, .14, 2.2); bell(ctx, t + 0.34, 1174.66, .1, 2.4); }
}

/* ── 알림 ───────────────────────────── */
async function ensurePermission(){
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  try { return (await Notification.requestPermission()) === 'granted'; } catch(e){ return false; }
}
function notify(title, body, kind){
  toast(title);
  chime(kind);
  try { navigator.vibrate && navigator.vibrate(kind === 'goal' ? [200, 100, 200, 100, 400] : [90, 60, 90]); } catch(e){}
  if (!S.notify || !('Notification' in window) || Notification.permission !== 'granted') return;
  const opt = { body, icon:'icon-192.png', badge:'icon-192.png', tag:'bium-stage' };
  const fallback = () => { try { new Notification(title, opt); } catch(e){} };
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
    navigator.serviceWorker.getRegistration().then(r => r ? r.showNotification(title, opt) : fallback()).catch(fallback);
  } else fallback();
}
function resetSeen(){
  if (!S.cur) return;
  const hrs = (Date.now() - S.cur.start) / H;
  S.cur.seen = STAGES.map((s, k) => k).filter(k => hrs >= STAGES[k].h);
  S.cur.goalSeen = hrs >= S.cur.goal;
}
function checkMilestones(ph){
  if (ph.p !== 'fast') return;
  const cur = S.cur; if (!Array.isArray(cur.seen)) resetSeen();
  let changed = false;
  if (!cur.seen.includes(ph.i)) {
    cur.seen.push(ph.i); changed = true;
    const s = STAGES[ph.i];
    if (!(cur.goalSeen === false && ph.ach)) notify(`${s.h}시간 · ${s.name}`, s.body.split('. ')[0] + '.', 'stage');
  }
  if (!cur.goalSeen && ph.ach) { cur.goalSeen = true; changed = true; notify(`목표 ${cur.goal}시간 달성 ✦`, '정말 잘했어요. 이제 천천히 마쳐도 좋아요.', 'goal'); }
  if (changed) save();
}

/* ── 공통 ───────────────────────────── */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
let view = 'today';
function go(v){
  view = v;
  ['today','stages','log'].forEach(k => { $('#v-' + k).hidden = k !== v; });
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  if (v === 'stages') renderStages();
  if (v === 'log') renderLog();
  if (v === 'today') renderToday();
  window.scrollTo({ top:0 });
}
function bindGo(root){ root.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go)); }
function renderAll(){
  const d = new Date();
  $('#todayLabel').textContent = d.toLocaleDateString('ko-KR', { month:'long', day:'numeric', weekday:'long' });
  renderToday();
  if (view === 'stages') renderStages();
  if (view === 'log') renderLog();
}

document.querySelectorAll('#nav button').forEach(b => b.onclick = () => go(b.dataset.view));
$('#btnSettings').onclick = settingsSheet;
$('#planChip').onclick = planSheet;
$('#mainBtn').onclick = () => { if (S.cur) endSheet(); else startFast(); };

function tick(){
  const now = Date.now(), ph = phase(now);
  checkMilestones(ph);
  if (sigOf(ph) !== sig) { renderToday(); if (view === 'stages') renderStages(); return; }
  if (view === 'today') tickToday(now, ph);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S = load(); renderAll(); } });
window.addEventListener('storage', e => { if (e.key === KEY) { S = load(); renderAll(); } });

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
makeStars();
renderAll();
setInterval(tick, 1000);

// 홈 화면 바로가기: ?a=start
(function(){
  const a = new URLSearchParams(location.search).get('a');
  if (a === 'start' && !S.cur) startFast();
  if (a) history.replaceState(null, '', location.pathname);
})();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
